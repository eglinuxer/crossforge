# M8 acceptance sample: links libssl (not policy-whitelisted), so the wheel
# pipeline must vendor libssl plus its transitive libcrypto dependency and
# rewrite every DT_NEEDED/DT_SONAME/DT_RUNPATH natively.
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demossl"
version = "0.1.0"
description = "crossforge wheel pipeline sample: vendored shared libraries"
