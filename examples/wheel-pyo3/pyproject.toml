# M8+ sample: PyO3 / maturin (Rust) extension. Needs the Rust build
# environment image:
#
#   docker build -t crossforge-buildenv:el8-rust -f docker/buildenv-rust.Dockerfile docker
#   crossforge wheel examples/wheel-pyo3 --image crossforge-buildenv:el8-rust
#
# Cross-compilation is driven entirely by the environment crossforge sets:
# CARGO_BUILD_TARGET + the per-target linker (the crossforge cross gcc) and
# PYO3_CROSS_LIB_DIR / PYO3_CROSS_PYTHON_VERSION from the target python pack.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "demorust"
version = "0.1.0"
description = "crossforge wheel pipeline sample: PyO3/maturin Rust extension"
requires-python = ">=3.9"

[tool.maturin]
# Keep the layout flat: the compiled cdylib is the whole distribution.
module-name = "demorust"
