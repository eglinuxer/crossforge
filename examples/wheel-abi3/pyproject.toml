# abi3 sample (design doc §9, T4): built once against the Limited API and
# tagged cp39-abi3, so a single wheel per arch covers every interpreter.
# crossforge wheel detects the abi3 tag, skips the remaining versions for
# that arch, and fans the import smoke out across all requested interpreters.
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "democaps"
version = "0.1.0"
description = "crossforge wheel pipeline sample: abi3 / Limited API extension"
requires-python = ">=3.9"
