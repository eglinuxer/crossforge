# M7 acceptance sample: nanobind + scikit-build-core (CMake backend). The
# module deliberately uses std::from_chars (float) and std::filesystem —
# GLIBCXX_3.4.29+ symbols that only pass the manylinux_2_28 policy audit
# through the toolchain's nonshared hybrid linking.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "demoxx"
version = "0.1.0"
description = "crossforge wheel pipeline sample: nanobind/CMake C++ extension"
# nanobind 2.2+ supports Python >= 3.10; crossforge wheel skips cp39.
requires-python = ">=3.10"
