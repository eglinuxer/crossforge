[package]
name = "crossforge"
version = "0.1.0"
edition = "2024"
description = "Cross-compilation toolchain build engine: old-glibc sysroots + libstdc++ nonshared hybrid linking"
repository = "https://github.com/eglinuxer/crossforge"
readme = "README.md"
# License file to be added before the repo goes public.
license = "MIT OR Apache-2.0"
# Distributed as a tool via GitHub (binaries + GHCR toolchain images), not crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
ureq = "2"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
quick-xml = "0.36"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# The CLI is the primary delivery form; build with --no-default-features to
# consume crossforge as a library only.
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "crossforge"
path = "src/bin/crossforge.rs"
required-features = ["cli"]
