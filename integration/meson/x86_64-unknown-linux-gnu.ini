[binaries]
c = '/opt/crossforge/targets/x86_64-unknown-linux-gnu/bin/x86_64-unknown-linux-gnu-gcc'
cpp = '/opt/crossforge/targets/x86_64-unknown-linux-gnu/bin/x86_64-unknown-linux-gnu-g++'
ar = '/opt/crossforge/targets/x86_64-unknown-linux-gnu/bin/x86_64-unknown-linux-gnu-ar'
strip = '/opt/crossforge/targets/x86_64-unknown-linux-gnu/bin/x86_64-unknown-linux-gnu-strip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['--sysroot=/opt/crossforge/sysroots/el8/x86_64']
cpp_args = ['--sysroot=/opt/crossforge/sysroots/el8/x86_64']
c_link_args = ['--sysroot=/opt/crossforge/sysroots/el8/x86_64']
cpp_link_args = ['--sysroot=/opt/crossforge/sysroots/el8/x86_64']

[properties]
needs_exe_wrapper = true
sys_root = '/opt/crossforge/sysroots/el8/x86_64'
pkg_config_libdir = ['/opt/crossforge/sysroots/el8/x86_64/usr/lib64/pkgconfig', '/opt/crossforge/sysroots/el8/x86_64/usr/lib/pkgconfig', '/opt/crossforge/sysroots/el8/x86_64/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
