# manylinux_2_28 wheel policy (design doc §9, T6), transcribed from
# auditwheel 6.8.1's manylinux-policy.json as the CI cross-check reference.
# Note the GLIBCXX ceiling 3.4.24 is one step BELOW the el8 system libstdc++
# (3.4.25): the policy is stricter than the baseline library, which is why
# wheel audits carry their own symbol-version table instead of reusing the
# sysroot abilists.

policy = "manylinux_2_28"
auditwheel_reference = "6.8.1"

# DT_NEEDED sonames a compliant wheel may carry without vendoring.
# The dynamic loaders are appended explicitly: auditwheel injects them at
# runtime per arch (on aarch64, glibc libraries commonly carry a DT_NEEDED
# on ld-linux itself), and vendoring a loader would be nonsense.
lib_whitelist = [
    "ld-linux-x86-64.so.2", "ld-linux-aarch64.so.1",

    "libatomic.so.1", "libgcc_s.so.1", "libstdc++.so.6", "libm.so.6",
    "libmvec.so.1", "libanl.so.1", "libdl.so.2", "librt.so.1", "libc.so.6",
    "libnsl.so.1", "libutil.so.1", "libpthread.so.0", "libX11.so.6",
    "libXext.so.6", "libXrender.so.1", "libICE.so.6", "libSM.so.6",
    "libGL.so.1", "libgobject-2.0.so.0", "libgthread-2.0.so.0",
    "libglib-2.0.so.0", "libresolv.so.2", "libexpat.so.1", "libz.so.1"
]

[symbol_versions.x86_64]
CXXABI = [
    "1.3", "1.3.1", "1.3.2", "1.3.3", "1.3.4", "1.3.5", "1.3.6", "1.3.7",
    "1.3.8", "1.3.9", "1.3.10", "1.3.11", "FLOAT128", "TM_1"
]
GCC = [
    "3.0", "3.3", "3.3.1", "3.4", "3.4.2", "3.4.4", "4.0.0", "4.2.0",
    "4.3.0", "4.7.0", "4.8.0", "7.0.0"
]
GLIBC = [
    "2.2.5", "2.2.6", "2.3", "2.3.2", "2.3.3", "2.3.4", "2.4", "2.5", "2.6",
    "2.7", "2.8", "2.9", "2.10", "2.11", "2.12", "2.13", "2.14", "2.15",
    "2.16", "2.17", "2.18", "2.22", "2.23", "2.24", "2.25", "2.26", "2.27",
    "2.28"
]
GLIBCXX = [
    "3.4", "3.4.1", "3.4.2", "3.4.3", "3.4.4", "3.4.5", "3.4.6", "3.4.7",
    "3.4.8", "3.4.9", "3.4.10", "3.4.11", "3.4.12", "3.4.13", "3.4.14",
    "3.4.15", "3.4.16", "3.4.17", "3.4.18", "3.4.19", "3.4.20", "3.4.21",
    "3.4.22", "3.4.23", "3.4.24"
]
LIBATOMIC = [
    "1.0", "1.1", "1.2"
]
ZLIB = [
    "1.2.0", "1.2.0.2", "1.2.0.8", "1.2.2", "1.2.2.3", "1.2.2.4", "1.2.3.3",
    "1.2.3.4", "1.2.3.5", "1.2.5.1", "1.2.5.2", "1.2.7.1", "1.2.9"
]

[symbol_versions.aarch64]
CXXABI = [
