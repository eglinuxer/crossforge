# Private symbols of whitelisted libraries that wheels must not reference.
[blacklist]
"libz.so.1" = [
    "_dist_code", "_length_code", "_tr_align", "_tr_flush_block", "_tr_init",
    "_tr_stored_block", "_tr_tally", "adler32_default", "bi_windup",
    "crc32_acle", "crc32_combine_gen", "crc32_combine_gen64",
    "crc32_combine_op", "crc32_le_vgfm_16", "crc32_neon", "crc32_vpmsum",
    "crc32_z_default", "crc_fold_512to32", "crc_fold_copy", "crc_fold_init",
    "deflate_copyright", "deflate_medium", "fill_window", "flush_pending",
    "gzflags", "inflate_copyright", "inflate_fast", "inflate_table",
    "longest_match", "slide_hash_sse", "sse2_slide_hash", "static_ltree",
    "uncompress2", "x86_check_features", "x86_cpu_has_pclmul",
    "x86_cpu_has_sse2", "x86_cpu_has_sse42", "z_errmsg", "z_vstring",
    "zcalloc", "zcfree"
]
