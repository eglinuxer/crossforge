# Built-in baseline registry (design doc §3.2).
# Each baseline is an immutable set of version ceilings plus a package source;
# adding a baseline is a data change, not a code change.

[[baseline]]
alias = "el8"
glibc = "2.28"
kernel_headers = "4.18"
glibcxx = "3.4.25"
cxxabi = "1.3.11"
cxx11_abi = true
source = "almalinux-8"
rh_nonshared = "80"
arches = ["x86_64", "aarch64"]

[[baseline]]
alias = "el7"
glibc = "2.17"
kernel_headers = "3.10"
glibcxx = "3.4.19"
cxxabi = "1.3.7"
# The baseline library (GCC 4.8.5) has no __cxx11 symbols at all, so the old
# string ABI is forced. See design doc §3.2.
cxx11_abi = false
source = "centos-7"
# No rh_nonshared: gcc-toolset-14 only builds the 80/110 levels (RHEL 8/9),
# so el7 uses crossforge's object-level pruning fallback (verified on centos:7).
arches = ["x86_64", "aarch64"]
