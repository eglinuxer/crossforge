# Built-in baseline registry (design doc §3.2).
# Each baseline is an immutable set of version ceilings plus a package source;
# adding a baseline is a data change, not a code change.
#
# el7 was removed on 2026-08-27: Rocky Linux starts at 8, so an el7 baseline
# could only come from the EOL CentOS 7 vault — the one source outside the
# Rocky/RHEL chain the rest of this project is built on. Downstreams that
# still need it can re-add the baseline through `merge_toml`.

[[baseline]]
alias = "el8"
glibc = "2.28"
kernel_headers = "4.18"
glibcxx = "3.4.25"
cxxabi = "1.3.11"
cxx11_abi = true
source = "rocky-8"
rh_nonshared = "80"
arches = ["x86_64", "aarch64"]
