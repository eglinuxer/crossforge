# Built-in upstream source components for compiler builds (design doc §5.2).
# GCC prerequisite versions follow GCC 11's contrib/download_prerequisites.

# 2.41 matches RH gcc-toolset-14's official binutils pairing; 2.40 kept for
# reference but its libsframe static-link integration is fragile (gas/ld can
# end up missing sframe_* symbols depending on libtool ordering).
[[component]]
name = "binutils"
version = "2.41"
url = "https://mirrors.kernel.org/gnu/binutils/binutils-{version}.tar.xz"
mirrors = [
    "https://sourceware.org/pub/binutils/releases/binutils-{version}.tar.xz",
    "https://ftpmirror.gnu.org/binutils/binutils-{version}.tar.xz",
]
sha256 = "ae9a5789e23459e59606e6714723f2d3ffc31c03174191ef0d015bdf06007450"

[[component]]
name = "binutils"
version = "2.40"
url = "https://mirrors.kernel.org/gnu/binutils/binutils-{version}.tar.xz"
mirrors = [
    "https://sourceware.org/pub/binutils/releases/binutils-{version}.tar.xz",
    "https://ftpmirror.gnu.org/binutils/binutils-{version}.tar.xz",
]
sha256 = "0f8a4c272d7f17f369ded10a4aca28b8e304828e95526da482b0ccc4dfc9d8e1"

# RH gcc-toolset-11: GCC 11.2.1 (2022-01-27 snapshot) + Red Hat patch series,
# offered as the older compiler choice for projects that need it. Its compat
# patch builds nonshared levels 44/48/80, so it covers the el8 baseline (80)
# as well as older ones a caller may register.
# The whole supply chain is Rocky Linux: it rebuilds RHEL bug-for-bug
# (AlmaLinux only targets ABI compatibility and carries its own revisions,
# e.g. its gts11 is an older 9.2.el8_6.alma.1).
[[component]]
name = "gcc"
version = "11.2.1"
kind = "srpm"
url = "https://download.rockylinux.org/pub/rocky/8/AppStream/source/tree/Packages/g/gcc-toolset-11-gcc-{version}-9.2.el8_9.src.rpm"
sha256 = "9f32e50b1fa303bebe1edaac62543d6a1c3704e74b3825eb1fec1c623a6e0d77"
# Conditional patches for features we do not build (isl graphite, docs, and
# the doxygen tree only used on rhel < 7).
skip_patches = [
    "gcc11-isl-dl.patch",
    "gcc11-isl-dl2.patch",
    "gcc11-libstdc++-docs.patch",
    "doxygen-1.7.1-config.patch",
    "doxygen-1.7.5-timestamp.patch",
    "doxygen-1.8.0-rh856725.patch",
]

# RH gcc-toolset-14: GCC 14.2.1 (2025-01-10 snapshot) + Red Hat patch series,
# including the libstdc++/libgfortran nonshared compat machinery (design doc
# §4.2). Sourced from Rocky Linux (bug-for-bug RHEL rebuild), matching the
# sysroot package source and the container bases.
[[component]]
name = "gcc"
version = "14.2.1"
kind = "srpm"
url = "https://download.rockylinux.org/pub/rocky/8/AppStream/source/tree/Packages/g/gcc-toolset-14-gcc-{version}-11.el8_10.src.rpm"
sha256 = "fabd21d53718b7a75100536711fd2d5ef61e1f6a1320837985fd5ae7ced852cc"
# Conditional patches for features we do not build (isl graphite, docs).
skip_patches = [
    "gcc14-isl-dl.patch",
    "gcc14-isl-dl2.patch",
    "gcc14-libstdc++-docs.patch",
    "isl-rh2155127.patch",
]

# pip bootstrap wheel for wheel-build environments (design doc §9, M7):
# python packs ship --with-ensurepip=no (matching manylinux), so pip runs out
# of this pinned wheel via PYTHONPATH. 25.2 is the last line supporting 3.9.
[[component]]
name = "pip"
version = "25.2"
url = "https://files.pythonhosted.org/packages/b7/3f/945ef7ab14dc4f9d7f40288d2df998d1837ee0888ec3659c813487572faa/pip-25.2-py3-none-any.whl"
sha256 = "6d67a2b4e7f14d8b31b8b52648866fa717f45a1eb70e83002f4331d07e953717"

