# Cross gdb, plus the two host libraries it needs statically. The el8 build
# container has both as packages, but linking them dynamically would give the
# debugger a dependency on libmpfr.so.4 — an el8-only soname that Ubuntu and
# Debian do not carry — while the rest of the toolchain runs anywhere with
# glibc >= 2.28. Built static, gdb keeps that property (verified on
# rockylinux:8, ubuntu:20.04 and debian:11).
[[component]]
name = "gdb"
version = "17.2"
url = "https://mirrors.kernel.org/gnu/gdb/gdb-{version}.tar.xz"
mirrors = [
    "https://sourceware.org/pub/gdb/releases/gdb-{version}.tar.xz",
    "https://ftpmirror.gnu.org/gdb/gdb-{version}.tar.xz",
]
sha256 = "1c036c0d72e4b3d1fb5c94c88632add6f9d76f4d7c4d2ea793c12a9f19a3228c"

