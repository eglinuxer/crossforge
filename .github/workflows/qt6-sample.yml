# The Qt 6 cross build, end to end — the evidence that the host companion
# earns its place in the environment image.
#
# Kept out of the per-commit gate deliberately. This builds three toolchains,
# a native Qt and a cross Qt before it has anything to audit, which is hours;
# what it buys is a class of defect a hello world cannot reach. Both findings
# from its first run — the libgcc compat gap and the DT_NEEDED whitelist
# reporting the sysroot's own loader — came from Qt exercising the toolchain
# the way a real project does. Weekly, on tags, and on demand.
name: qt6-sample

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC — after toolchain-testsuite has had its run.
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]

concurrency:
  group: qt6-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASELINE: el8
      GCC: "14.2.1"
      HOST_ID: gcc14.2.1-el8-x86_64
      TARGET_ID: gcc14.2.1-el8-qt6-aarch64
      IMAGE: crossforge-crossenv:el8-aarch64-qt6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Qt's build trees are large enough that the stock runner image does
      # not leave room for them alongside three toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build crossforge
        run: cargo build --release

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build el8 build environment image
        run: docker build -t crossforge-buildenv:el8 -f docker/buildenv.Dockerfile docker

      # The native companion, which stage 1 uses to build moc and rcc. Its
      # GCC build tree is reclaimed immediately: nothing below needs it, and
      # two of them plus Qt do not fit on a hosted runner. The installed
      # prefixes under work/toolchains are what the rest of the job uses.
      - name: Build host toolchain (x86_64)
        run: |
          ./target/release/crossforge build \
            --gcc "$GCC" --baseline "$BASELINE" --target x86_64 \
            --image crossforge-buildenv:el8 --work-dir "$PWD/work"
          sudo rm -rf work/build
          df -h /

      # The qt6 profile clones the base aarch64 toolchain and swaps in the
      # deeper sysroot, so this builds that compiler too.
      - name: Build target toolchain (aarch64, qt6 sysroot profile)
        run: |
          ./target/release/crossforge build \
            --gcc "$GCC" --baseline "$BASELINE" --target aarch64 \
            --sysroot-profile qt6 \
            --image crossforge-buildenv:el8 --work-dir "$PWD/work"
          sudo rm -rf work/build
          df -h /

      # crossforge runs its builders as root in the container, so the tree it
      # leaves behind is root-owned; the sample runs docker as the invoking
      # user and writes its Qt trees into the same work dir.
      - name: Take ownership of the work tree
        run: sudo chown -R "$(id -u):$(id -g)" work

      # Composed here rather than pulled: the published crossenv carries the
      # minimal sysroot, and Qt needs the qt6 profile's freetype, fontconfig,
      # X11, wayland, xkbcommon and EGL to get through its configure.
      - name: Compose the cross build environment
        run: |
          docker build -f docker/toolchain.Dockerfile \
            --build-arg TOOLCHAIN_ID="$HOST_ID" \
            -t crossforge-toolchain:host work/toolchains
          docker build -f docker/toolchain.Dockerfile \
            --build-arg TOOLCHAIN_ID="$TARGET_ID" \
            -t crossforge-toolchain:target work/toolchains
          docker build -f docker/crossenv.Dockerfile \
            --build-arg HOST_IMAGE=crossforge-toolchain:host \
            --build-arg TARGET_IMAGE=crossforge-toolchain:target \
            --build-arg HOST_ID="$HOST_ID" \
            --build-arg TARGET_ID="$TARGET_ID" \
            --build-arg BASELINE="$BASELINE" \
            --build-arg SYSROOT_PROFILE=qt6 \
            -t "$IMAGE" .

      # Host Qt, cross Qt, the sample application, the audit gate and the
      # qemu run. The script fails the job on any of them.
      - name: Cross-build and run the Qt 6 sample
        run: |
          WORK="$PWD/work" \
          CROSSFORGE="$PWD/target/release/crossforge" \
          JOBS="$(nproc)" \
          ./examples/qt6-cross/build.sh

      - name: Collect the built artifacts
        if: always()
        run: |
          mkdir -p results
          cp work/qt6/build-target/config.summary results/ 2>/dev/null || true
          cp work/qt6/build-sample/qt6_cross results/ 2>/dev/null || true
          cp work/qt6/target/lib/libQt6Core.so.6.* results/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qt6-cross-artifacts
          path: results/
          if-no-files-found: warn
