# The Qt 6 cross build, end to end — the evidence that the host companion
# earns its place in the environment image.
#
# What this qualifies is the *published* image, used as shipped: the sample
# pulls crossenv:el8-aarch64 and takes the toolchain out of it rather than
# building one. Qt needs a deeper sysroot than that image carries, and the
# sample generates it from a lockfile and swaps it in — the extra depth is a
# property of this test, not something the product should ship.
#
# Kept out of the per-commit gate: a native Qt and a cross Qt is over an
# hour before there is anything to audit. What it buys is a class of defect
# a hello world cannot reach — both findings from its first run, the libgcc
# compat gap and the DT_NEEDED whitelist reporting the sysroot's own loader,
# came from Qt exercising the toolchain the way a real project does.
name: qt6-sample

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC — after toolchain-testsuite has had its run.
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]

concurrency:
  group: qt6-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Qt's two build trees are large enough that the stock runner image
      # does not leave room for them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Needed for the sysroot the sample assembles, and for the audit gate.
      - name: Build crossforge
        run: cargo build --release

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sample pulls the image, extracts its toolchain, assembles the
      # qt6 sysroot, then builds host Qt, cross Qt and the application,
      # audits them and runs the result under qemu. It fails the job on any
      # of those.
      - name: Cross-build and run the Qt 6 sample
        run: |
          WORK="$PWD/work" \
          IMAGE="ghcr.io/${{ github.repository }}/crossenv:el8-aarch64" \
          CROSSFORGE="$PWD/target/release/crossforge" \
          JOBS="$(nproc)" \
          ./examples/qt6-cross/build.sh

      - name: Collect the built artifacts
        if: always()
        run: |
          mkdir -p results
          cp work/qt6/build-target/config.summary results/ 2>/dev/null || true
          cp work/qt6/build-sample/qt6_cross results/ 2>/dev/null || true
          cp work/qt6/target/lib/libQt6Core.so.6.* results/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qt6-cross-artifacts
          path: results/
          if-no-files-found: warn
