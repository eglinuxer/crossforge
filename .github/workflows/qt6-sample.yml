# The Qt 6 cross build, end to end — the evidence that the host companion
# earns its place in the environment image.
#
# Runs against the *published* qt6 crossenv rather than a locally rebuilt
# one, so what it qualifies is what a downstream actually pulls. On a tag
# push this workflow and toolchain-images start together, so the image here
# is the previously published one; that is the right thing to qualify
# anyway.
#
# Kept out of the per-commit gate: a native Qt and a cross Qt is over an
# hour before there is anything to audit. What it buys is a class of defect
# a hello world cannot reach — both findings from its first run, the libgcc
# compat gap and the DT_NEEDED whitelist reporting the sysroot's own loader,
# came from Qt exercising the toolchain the way a real project does.
name: qt6-sample

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC — after toolchain-testsuite has had its run.
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]

concurrency:
  group: qt6-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    env:
      TARGET_ID: gcc14.2.1-el8-qt6-aarch64
      TRIPLE: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Qt's two build trees are large enough that the stock runner image
      # does not leave room for them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build crossforge
        run: cargo build --release

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The audit and the qemu run happen on the runner, not in the
      # container, so the toolchain has to exist as files here too: the
      # sample points CMake at its toolchain file and the audit at its
      # sysroot. Extracting the published image is what keeps this job
      # honest — nothing is rebuilt, so nothing can differ from what was
      # shipped.
      - name: Pull the qt6 cross build environment and extract its toolchain
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/crossenv:el8-aarch64-qt6"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" \
            --format 'sysroot profile: {{ index .Config.Labels "org.crossforge.sysroot-profile" }}'
          mkdir -p work/toolchains
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/opt/crossforge/$TARGET_ID" "work/toolchains/$TARGET_ID"
          docker rm "$cid"
          test -x "work/toolchains/$TARGET_ID/bin/$TRIPLE-g++"
          test -f "work/toolchains/$TARGET_ID/toolchain.cmake"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Host Qt, cross Qt, the sample application, the audit gate and the
      # qemu run. The script fails the job on any of them.
      - name: Cross-build and run the Qt 6 sample
        run: |
          WORK="$PWD/work" \
          CROSSFORGE="$PWD/target/release/crossforge" \
          JOBS="$(nproc)" \
          ./examples/qt6-cross/build.sh

      - name: Collect the built artifacts
        if: always()
        run: |
          mkdir -p results
          cp work/qt6/build-target/config.summary results/ 2>/dev/null || true
          cp work/qt6/build-sample/qt6_cross results/ 2>/dev/null || true
          cp work/qt6/target/lib/libQt6Core.so.6.* results/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qt6-cross-artifacts
          path: results/
          if-no-files-found: warn
