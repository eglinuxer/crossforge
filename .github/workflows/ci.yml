name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release configuration
        run: ./scripts/validate-release.py
      - name: Configuration tests
        run: python3 -m unittest discover -s tests/config -p 'test_*.py'
      - name: Generated Bake definition
        run: ./scripts/render-bake.py --check
      - name: Docker/Bake validation stage
        run: docker buildx bake validate --progress=plain
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Format check
        run: cargo fmt --check
      - name: Tests (lib + cli)
        run: cargo test --features cli
      - name: Docs build
        run: cargo doc --no-deps
