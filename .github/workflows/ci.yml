name: ci

concurrency:
  # PR updates replace stale checks; distinct main commits can run quick
  # checks immediately even while an older commit is still compiling.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      quick-only:
        description: Run static checks without duplicating candidate qualification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/lint-workflows
      - uses: ./.github/actions/setup-locked-buildx
      - name: Release configuration
        run: |
          ./scripts/validate-release.py
          ./scripts/validate-gcc-testsuite.py --plan config/gcc-testsuite-full.json
          ./scripts/validate-qt-qualification.py --require-locked
          ./scripts/validate-qt-runtime-qualification.py
          ./scripts/validate-supply-chain-evidence.py
          ./scripts/validate-frozen-abi.py
          ./scripts/validate-python-runtime-providers.py
      - name: RPM plans, transactions, and locks
        run: |
          ./scripts/validate-rpm-lock.py config/rpm/sysroot-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/sysroot-el8-aarch64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-build-common-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-gcc-build-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-gcc-test-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-python-build-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-runtime-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/host-qt-build-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/qt-target-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/qt-target-el8-aarch64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/qt-runtime-el8-x86_64.plan.json
          ./scripts/validate-rpm-lock.py config/rpm/qt-runtime-el8-aarch64.plan.json
          ./scripts/validate-rpm-lock.py locks/sysroot-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/sysroot-el8-aarch64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-build-common-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-gcc-build-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-gcc-test-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-python-build-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-runtime-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/host-qt-build-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/qt-target-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/qt-target-el8-aarch64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/qt-runtime-el8-x86_64.json --require-lock
          ./scripts/validate-rpm-lock.py locks/qt-runtime-el8-aarch64.json --require-lock
      - name: Configuration tests
        run: python3 -m unittest discover -s tests/config -p 'test_*.py'
      - name: Packaging planner tests
        run: python3 -m unittest discover -s tests/packaging -p 'test_*.py'
      - name: Script syntax
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile docker/*.py
          python3 -m py_compile tools/crossforge/*.py
          for script in scripts/*.sh docker/*.sh; do
            bash -n "$script"
          done
          gcc -fsyntax-only -fPIC -Wall -Wextra -Werror scripts/deny-target-exec.c
          gcc -fsyntax-only -Wall -Wextra -Werror scripts/target-exec-canary.c
          gcc -fsyntax-only -Wall -Wextra -Werror scripts/target-artifact-canary.c
          gcc -fsyntax-only -Wall -Wextra -Werror scripts/qt-plugin-probe.c
      - name: Generated Bake definition
        run: |
          ./scripts/render-release-components.py --check
          ./scripts/render-vcpkg-integration.py --check
          ./scripts/render-bake.py --check
      - name: Docker/Bake static checks
        run: |
          docker buildx bake --check phase4 host-runtime-qualified
          docker buildx bake --print phase5 phase6 phase7 phase8 phase9 phase10 \
            phase13-source phase13-host-tools phase13-integration \
            phase13-contract phase13-ports phase14 phase15 phase16 \
            qt-source-qualified qt-target-runtime-qualified candidate >/dev/null
      - name: Select affected build profile
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          if test "$EVENT_NAME" = pull_request; then
            base=$(git merge-base "$PR_BASE" "$GITHUB_SHA")
          elif test "$EVENT_NAME" = push && git cat-file -e "$PUSH_BASE^{commit}"; then
            base=$PUSH_BASE
          else
            echo 'profile=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci-plan.py plan --base "$base" --head "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"

  builds:
    needs: quick
    concurrency:
      group: ci-builds-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/verify-builds.yml
    with:
      profile: ${{ inputs.quick-only && 'none' || needs.quick.outputs.profile }}

  pr-required:
    if: always()
    needs: [quick, builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful checks and selected builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci-plan.py check "$RESULTS"
