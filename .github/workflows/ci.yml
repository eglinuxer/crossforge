name: ci

concurrency:
  # PR updates replace stale checks; distinct main commits can run quick
  # checks immediately even while an older commit is still compiling.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    uses: ./.github/workflows/verify-quick.yml

  builds-readonly:
    needs: quick
    if: ${{ !(github.server_url == 'https://github.com' && github.repository == 'eglinuxer/crossforge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    permissions:
      contents: read
    concurrency:
      group: ci-builds-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/verify-incremental.yml
    with:
      profile: ${{ needs.quick.outputs.profile }}
      selection: ${{ needs.quick.outputs.selection }}
      component-reader: false

  builds-components:
    needs: quick
    if: ${{ github.server_url == 'https://github.com' && github.repository == 'eglinuxer/crossforge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ci-builds-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/verify-main-incremental.yml
    with:
      profile: ${{ needs.quick.outputs.profile }}
      selection: ${{ needs.quick.outputs.selection }}

  builds:
    if: always()
    needs: [quick, builds-readonly, builds-components]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the selected permission boundary to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-component-plan.py check-routes "$RESULTS"

  pr-required:
    if: always()
    needs: [quick, builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful checks and selected builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci-plan.py check "$RESULTS"
