name: full qualification

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      cold:
        description: Ignore remote caches to measure cold hosted builds
        type: boolean
        default: false
  workflow_call:

# Only this wrapper grants write access; serialize every writer, including
# candidate prequalification, so parallel runs cannot replace the same cache.
concurrency:
  group: crossforge-qualified-cache
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/lint-workflows
      - name: Validate the exact trusted source before building
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = eglinuxer/crossforge
          test "$GITHUB_REF" = refs/heads/main
          ./scripts/validate-release.py --require-locked
          ./scripts/validate-supply-chain-evidence.py
          ./scripts/validate-frozen-abi.py
          ./scripts/validate-python-runtime-providers.py
          ./scripts/render-release-components.py --check
          ./scripts/render-vcpkg-integration.py --check
          ./scripts/render-bake.py --check
          python3 -m unittest discover -s tests/config -p 'test_*.py'
          python3 -m unittest discover -s tests/packaging -p 'test_*.py'
  builds:
    needs: preflight
    uses: ./.github/workflows/verify-builds.yml
    with:
      profile: full
      write-cache: true
      cold: ${{ inputs.cold == true }}
