name: public candidate

concurrency:
  group: candidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CANDIDATE_REPOSITORY: ghcr.io/eglinuxer/crossforge

jobs:
  quick:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-quick.yml
    with:
      plan-components: false

  qualify:
    needs: quick
    # All canonical release gates still run. Missing raw components are
    # prepared once; this candidate does not join the shared cache-writer queue.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/verify-main-incremental.yml
    with:
      profile: full

  source-publication:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      checkpoint_artifact_id: ${{ steps.checkpoint_artifact.outputs.artifact-id }}
      checkpoint_sha256: ${{ steps.checkpoint.outputs.checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-locked-buildx
      - uses: ./.github/actions/configure-build-cache
      - name: Validate candidate inputs
        id: release_inputs
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          ./scripts/validate-release.py --require-locked
          ./scripts/validate-supply-chain-evidence.py
          ./scripts/validate-rpm-source-lock.py
          ./scripts/validate-frozen-abi.py
          ./scripts/validate-python-runtime-providers.py
          ./scripts/validate-qt-runtime-qualification.py
          ./scripts/render-release-components.py --check
          ./scripts/render-vcpkg-integration.py --check
          ./scripts/render-bake.py --check
          generator_repository=$(jq -r .sbom.generator.repository \
            config/release.json)
          generator_digest=$(jq -r .sbom.generator.digest config/release.json)
          generator_manifest=$(jq -r .sbom.generator.manifest_digest \
            config/release.json)
          generator="$generator_repository@$generator_digest"
          docker buildx imagetools inspect "$generator" --raw \
            > "$RUNNER_TEMP/sbom-generator-index.json"
          test "$(./scripts/resolve_candidate_image.py platform-digest \
            --index "$RUNNER_TEMP/sbom-generator-index.json" \
            --expected-digest "$generator_digest")" = "$generator_manifest"
          printf 'sbom_generator=%s\n' "$generator" >> "$GITHUB_OUTPUT"
      - name: Validate the locked SBOM generator image and source identity
        uses: ./.github/actions/validate-sbom-generator
        with:
          output: ${{ runner.temp }}/sbom-generator-image.json
      - name: Resolve unique public candidate tag
        id: identity
        run: |
          set -Eeuo pipefail
          tag=$(./scripts/candidate_manifest.py tag \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")
          reference="$CANDIDATE_REPOSITORY:$tag"
          source_tag="source-$tag"
          source_reference="$CANDIDATE_REPOSITORY:$source_tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'source_tag=%s\n' "$source_tag" >> "$GITHUB_OUTPUT"
          printf 'source_reference=%s\n' "$source_reference" >> "$GITHUB_OUTPUT"
      - name: Qualify Sigstore source signatures offline
        run: |
          set -Eeuo pipefail
          docker buildx bake sigstore-sources-qualified --progress=plain
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Reject an existing candidate tag
        env:
          CANDIDATE_REFERENCE: ${{ steps.identity.outputs.reference }}
          SOURCE_REFERENCE: ${{ steps.identity.outputs.source_reference }}
        run: |
          set -Eeuo pipefail
          for reference in "$CANDIDATE_REFERENCE" "$SOURCE_REFERENCE"; do
            if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
              echo "candidate tag already exists: $reference" >&2
              exit 1
            fi
          done
      - name: Build once and push the corresponding source bundle
        id: source
        env:
          SBOM_GENERATOR: ${{ steps.release_inputs.outputs.sbom_generator }}
          SOURCE_REFERENCE: ${{ steps.identity.outputs.source_reference }}
        run: |
          set -Eeuo pipefail
          identity_root="$RUNNER_TEMP/source-bundle-identity"
          mkdir -p "$RUNNER_TEMP/candidate-build-diagnostics"
          python3 ./scripts/run-with-heartbeat.py \
            --label source-bundle-publish --interval 60 \
            --log "$RUNNER_TEMP/candidate-build-diagnostics/build.log" -- \
            docker buildx bake source-bundle \
            --set "source-bundle.args.CROSSFORGE_SOURCE_COMMIT=$GITHUB_SHA" \
            --set "source-bundle.tags=$SOURCE_REFERENCE" \
            --set "source-bundle.output=type=image,push=true" \
            --set "source-bundle.attest=type=provenance,mode=max,version=v1" \
            --set "source-bundle.attest+=type=sbom,generator=$SBOM_GENERATOR" \
            --metadata-file "$RUNNER_TEMP/source-build-metadata.json" \
            --progress=plain
          docker buildx bake source-bundle-identity \
            --set "source-bundle-identity.args.CROSSFORGE_SOURCE_COMMIT=$GITHUB_SHA" \
            --set "source-bundle-identity.output=type=local,dest=$identity_root" \
            --progress=plain
          source_digest=$(./scripts/resolve_candidate_image.py buildx-digest \
            --target source-bundle \
            --metadata "$RUNNER_TEMP/source-build-metadata.json")
          docker buildx imagetools inspect \
            "$CANDIDATE_REPOSITORY@$source_digest" --raw \
            > "$RUNNER_TEMP/source-index.json"
          source_platform_digest=$(./scripts/resolve_candidate_image.py \
            platform-digest --index "$RUNNER_TEMP/source-index.json" \
            --expected-digest "$source_digest")
          source_identity="$identity_root/source-bundle.json"
          test "$(jq -r .source_commit "$source_identity")" = "$GITHUB_SHA"
          source_archive_sha256=$(jq -r .archive.sha256 "$source_identity")
          source_archive_size=$(jq -r .archive.size "$source_identity")
          test "${#source_archive_sha256}" -eq 64
          test "$source_archive_size" -gt 1456725209
          ./scripts/source_binding.py create \
            --source-commit "$GITHUB_SHA" \
            --digest "$source_digest" \
            --platform-manifest-digest "$source_platform_digest" \
            --archive-sha256 "$source_archive_sha256" \
            --archive-size "$source_archive_size" \
            --output "$RUNNER_TEMP/source-binding.json"
          printf 'digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'platform_digest=%s\n' "$source_platform_digest" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$source_archive_sha256" >> "$GITHUB_OUTPUT"
          printf 'archive_size=%s\n' "$source_archive_size" >> "$GITHUB_OUTPUT"
      - name: Seal source publication checkpoint
        id: checkpoint
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-publication.py seal --phase source \
            --root "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/source-publication-checkpoint"
      - name: Upload source publication checkpoint
        id: checkpoint_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-publication-checkpoint/
          if-no-files-found: error
          retention-days: 90
      - name: Export publication BuildKit diagnostics
        if: always()
        run: ./scripts/collect-buildkit-diagnostics.sh "$RUNNER_TEMP/candidate-build-diagnostics"
      - name: Preserve source publication build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-source-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-build-diagnostics/
            ${{ runner.temp }}/source-build-metadata.json
          if-no-files-found: warn
          retention-days: 90
      - name: Log out the publication writer
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  sdk-publication:
    needs: [source-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      checkpoint_artifact_id: ${{ steps.checkpoint_artifact.outputs.artifact-id }}
      checkpoint_sha256: ${{ steps.checkpoint.outputs.checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/configure-build-cache
      - name: Require the original source publication
        env:
          PUBLICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/candidate-publication.py upstream --phase source --needs-json "$PUBLICATION_NEEDS"
      - name: Download original source publication checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-publication.outputs.checkpoint_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-checkpoint
      - name: Restore and verify the original source publication
        id: source
        env:
          CHECKPOINT_SHA256: ${{ needs.source-publication.outputs.checkpoint_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-publication.py restore --phase source \
            --directory "$RUNNER_TEMP/source-checkpoint" \
            --sha256 "$CHECKPOINT_SHA256" --output "$RUNNER_TEMP"
      - name: Resolve unique public candidate tag
        id: identity
        env:
          ORIGINAL_SOURCE_REFERENCE: ${{ steps.source.outputs.source_reference }}
        run: |
          set -Eeuo pipefail
          tag=$(./scripts/candidate_manifest.py tag \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")
          reference="$CANDIDATE_REPOSITORY:$tag"
          source_reference="$ORIGINAL_SOURCE_REFERENCE"
          source_tag=${source_reference#"$CANDIDATE_REPOSITORY:"}
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'source_tag=%s\n' "$source_tag" >> "$GITHUB_OUTPUT"
          printf 'source_reference=%s\n' "$source_reference" >> "$GITHUB_OUTPUT"
      - name: Prove the complete source payload is anonymously retrievable
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          SOURCE_PLATFORM_DIGEST: ${{ steps.source.outputs.platform_digest }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io
          source_image="$CANDIDATE_REPOSITORY@$SOURCE_DIGEST"
          docker buildx imagetools inspect "$source_image" --raw \
            > "$RUNNER_TEMP/anonymous-source-index.json"
          anonymous_source_platform=$(./scripts/resolve_candidate_image.py \
            platform-digest --index "$RUNNER_TEMP/anonymous-source-index.json" \
            --expected-digest "$SOURCE_DIGEST")
          test "$anonymous_source_platform" = "$SOURCE_PLATFORM_DIGEST"
          source_identity="$RUNNER_TEMP/source-bundle-identity/source-bundle.json"
          source_archive_file=$(jq -r .archive.file "$source_identity")
          test "$source_archive_file" = \
            "crossforge-source-$GITHUB_SHA.tar.zst"
          source_container=""
          cleanup_source_container() {
            if test -n "$source_container"; then
              docker rm --force "$source_container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_source_container EXIT
          source_container=$(docker create --pull=always \
            --platform linux/amd64 "$source_image" /bin/true)
          observed_source_sha256=$(docker export "$source_container" \
            | tar -xOf - "$source_archive_file" \
            | sha256sum | awk '{print $1}')
          test "$observed_source_sha256" = "$SOURCE_ARCHIVE_SHA256"
          docker rm "$source_container"
          source_container=""
          trap - EXIT
          docker image rm "$source_image" >/dev/null 2>&1 || true
      - name: Log back in to GHCR for SDK publication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/setup-component-transport
        id: transport
      - uses: ./.github/actions/setup-component-verifier
        id: verifier
      - name: Bind the complete candidate to authenticated raw components
        id: components
        env:
          COMPONENT_BUILDER: ${{ steps.buildx.outputs.builder }}
          COMPONENT_ORAS: ${{ steps.transport.outputs.binary }}
          COMPONENT_COSIGN: ${{ steps.verifier.outputs.binary }}
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-components.py prepare \
            --source-binding "$RUNNER_TEMP/source-binding.json" \
            --directory "$RUNNER_TEMP/candidate-components" --data "$RUNNER_TEMP/candidate-component-data" \
            --builder "$COMPONENT_BUILDER" --oras "$COMPONENT_ORAS" --cosign "$COMPONENT_COSIGN"
      - name: Reject an existing SDK publication tag
        env:
          CANDIDATE_REFERENCE: ${{ steps.identity.outputs.reference }}
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$CANDIDATE_REFERENCE" >/dev/null 2>&1; then
            echo "candidate tag already exists: $CANDIDATE_REFERENCE" >&2
            exit 1
          fi
      - name: Build once and push the source-bound candidate
        env:
          CANDIDATE_REFERENCE: ${{ steps.identity.outputs.reference }}
          SBOM_GENERATOR: ${{ steps.source.outputs.sbom_generator }}
          COMPONENT_BUILDER: ${{ steps.buildx.outputs.builder }}
          BINDING_SHA256: ${{ steps.components.outputs.binding_sha256 }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-build-diagnostics"
          python3 ./scripts/run-with-heartbeat.py \
            --label sdk-candidate-publish --interval 60 \
            --log "$RUNNER_TEMP/candidate-build-diagnostics/build.log" -- \
            python3 scripts/candidate-components.py build \
            --source-binding "$RUNNER_TEMP/source-binding.json" \
            --directory "$RUNNER_TEMP/candidate-components" \
            --builder "$COMPONENT_BUILDER" --sha256 "$BINDING_SHA256" \
            --reference "$CANDIDATE_REFERENCE" --sbom-generator "$SBOM_GENERATOR" \
            --output-root "$RUNNER_TEMP"
      - name: Bind the pushed OCI index and platform manifest
        id: digest
        env:
          CANDIDATE_REFERENCE: ${{ steps.identity.outputs.reference }}
        run: |
          set -Eeuo pipefail
          candidate_digest=$(./scripts/resolve_candidate_image.py buildx-digest \
            --metadata "$RUNNER_TEMP/build-metadata.json")
          docker buildx imagetools inspect \
            "$CANDIDATE_REPOSITORY@$candidate_digest" --raw \
            > "$RUNNER_TEMP/candidate-index.json"
          platform_digest=$(./scripts/resolve_candidate_image.py platform-digest \
            --index "$RUNNER_TEMP/candidate-index.json" \
            --expected-digest "$candidate_digest")
          ./scripts/candidate_manifest.py create \
            --source-commit "$GITHUB_SHA" \
            --digest "$candidate_digest" \
            --platform-manifest-digest "$platform_digest" \
            --source-bundle-digest "${{ steps.source.outputs.digest }}" \
            --source-bundle-platform-manifest-digest \
              "${{ steps.source.outputs.platform_digest }}" \
            --source-bundle-identity \
              "$RUNNER_TEMP/source-bundle-identity/source-bundle.json" \
            --output "$RUNNER_TEMP/candidate.json"
          ./scripts/candidate_manifest.py validate \
            "$RUNNER_TEMP/candidate.json" \
            --expected-source-commit "$GITHUB_SHA"
          jq --sort-keys .source_bundle "$RUNNER_TEMP/candidate.json" \
            > "$RUNNER_TEMP/candidate-source-binding.json"
          jq --sort-keys \
            '{repository, digest, platform, platform_manifest_digest, archive}' \
            "$RUNNER_TEMP/source-binding.json" \
            > "$RUNNER_TEMP/expected-source-binding.json"
          cmp "$RUNNER_TEMP/expected-source-binding.json" \
            "$RUNNER_TEMP/candidate-source-binding.json"
          printf 'digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'platform_digest=%s\n' "$platform_digest" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/candidate.json" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from crossforge_internal.identity import content_sha256, load_json
          print('candidate_sha256=' + content_sha256(load_json(sys.argv[1])))
          PY
          test "$CANDIDATE_REFERENCE" = \
            "$CANDIDATE_REPOSITORY:${{ steps.identity.outputs.tag }}"
          test "${{ steps.identity.outputs.source_reference }}" = \
            "$CANDIDATE_REPOSITORY:${{ steps.identity.outputs.source_tag }}"
      - name: Recheck the exact component binding after publication
        env:
          COMPONENT_BUILDER: ${{ steps.buildx.outputs.builder }}
          BINDING_SHA256: ${{ steps.components.outputs.binding_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-components.py check \
            --source-binding "$RUNNER_TEMP/source-binding.json" \
            --directory "$RUNNER_TEMP/candidate-components" \
            --builder "$COMPONENT_BUILDER" --sha256 "$BINDING_SHA256"
          cp "$RUNNER_TEMP/candidate-components/component-selection.json" "$RUNNER_TEMP/component-selection.json"
      - name: Seal sdk publication checkpoint
        id: checkpoint
        env:
          SOURCE_CHECKPOINT_SHA256: ${{ needs.source-publication.outputs.checkpoint_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-publication.py seal --phase sdk \
            --root "$RUNNER_TEMP" \
            --source-checkpoint "$RUNNER_TEMP/source-checkpoint" \
            --source-sha256 "$SOURCE_CHECKPOINT_SHA256" \
            --output "$RUNNER_TEMP/sdk-publication-checkpoint"
      - name: Upload sdk publication checkpoint
        id: checkpoint_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-publication-checkpoint/
          if-no-files-found: error
          retention-days: 90
      - name: Export publication BuildKit diagnostics
        if: always()
        run: ./scripts/collect-buildkit-diagnostics.sh "$RUNNER_TEMP/candidate-build-diagnostics"
      - name: Preserve sdk publication build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-sdk-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-build-diagnostics/
            ${{ runner.temp }}/build-metadata.json
            ${{ runner.temp }}/candidate-execution.jsonl
            ${{ runner.temp }}/candidate-qualification*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve candidate component identities and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-component-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-components/
          if-no-files-found: warn
          retention-days: 90
      - name: Log out the publication writer
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  publish:
    needs: [sdk-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      candidate_digest: ${{ steps.inputs.outputs.digest }}
      platform_digest: ${{ steps.inputs.outputs.platform_digest }}
      probe_bundle_sha256: ${{ steps.native_probe.outputs.bundle_sha256 }}
      candidate_sha256: ${{ steps.inputs.outputs.candidate_sha256 }}
      publish_attempt: ${{ steps.inputs.outputs.attempt }}
      identity_artifact_id: ${{ steps.identity_artifact.outputs.artifact-id }}
      probe_artifact_id: ${{ steps.probe_artifact.outputs.artifact-id }}
      source_attempt: ${{ steps.inputs.outputs.source_attempt }}
      source_checkpoint_sha256: ${{ steps.inputs.outputs.source_checkpoint_sha256 }}
      sdk_attempt: ${{ steps.inputs.outputs.sdk_attempt }}
      sdk_checkpoint_sha256: ${{ steps.inputs.outputs.sdk_checkpoint_sha256 }}
      component_selection_sha256: ${{ steps.inputs.outputs.component_selection_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-locked-buildx
      - name: Require the original sdk publication
        env:
          PUBLICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/candidate-publication.py upstream --phase sdk --needs-json "$PUBLICATION_NEEDS"
      - name: Download original sdk publication checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sdk-publication.outputs.checkpoint_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sdk-checkpoint
      - name: Restore and verify the original sdk publication
        id: inputs
        env:
          CHECKPOINT_SHA256: ${{ needs.sdk-publication.outputs.checkpoint_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 scripts/candidate-publication.py restore --phase sdk \
            --directory "$RUNNER_TEMP/sdk-checkpoint" \
            --sha256 "$CHECKPOINT_SHA256" --output "$RUNNER_TEMP"
      - name: Prove anonymous public availability
        env:
          CANDIDATE_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect \
            "$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST" --raw \
            > "$RUNNER_TEMP/anonymous-candidate-index.json"
          anonymous_platform=$(./scripts/resolve_candidate_image.py platform-digest \
            --index "$RUNNER_TEMP/anonymous-candidate-index.json" \
            --expected-digest "$CANDIDATE_DIGEST")
          test "$anonymous_platform" = \
            "${{ steps.inputs.outputs.platform_digest }}"
          docker buildx imagetools inspect \
            "$CANDIDATE_REPOSITORY@${{ steps.inputs.outputs.source_digest }}" --raw \
            > "$RUNNER_TEMP/anonymous-source-index.json"
          anonymous_source_platform=$(./scripts/resolve_candidate_image.py \
            platform-digest --index "$RUNNER_TEMP/anonymous-source-index.json" \
            --expected-digest "${{ steps.inputs.outputs.source_digest }}")
          test "$anonymous_source_platform" = \
            "${{ steps.inputs.outputs.source_platform_digest }}"
      - name: Validate public source provenance and SBOM
        uses: ./.github/actions/validate-public-attestations
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          index: ${{ runner.temp }}/anonymous-source-index.json
          index-digest: ${{ steps.inputs.outputs.source_digest }}
          platform-digest: ${{ steps.inputs.outputs.source_platform_digest }}
          image-kind: source-bundle
          source-commit: ${{ github.sha }}
          output: ${{ runner.temp }}/source-attestations.json
      - name: Validate public SDK provenance and SBOM
        uses: ./.github/actions/validate-public-attestations
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          index: ${{ runner.temp }}/anonymous-candidate-index.json
          index-digest: ${{ steps.inputs.outputs.digest }}
          platform-digest: ${{ steps.inputs.outputs.platform_digest }}
          image-kind: sdk-candidate
          source-commit: ${{ github.sha }}
          output: ${{ runner.temp }}/sdk-attestations.json
      - name: Run the anonymous non-root candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image="$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST"
          test "$(docker run --rm --pull=always "$image" id -u)" = 1000
          docker run --rm "$image" cat /opt/crossforge/SOURCES.json \
            > "$RUNNER_TEMP/candidate-sources.json"
          cmp "$RUNNER_TEMP/source-binding.json" \
            "$RUNNER_TEMP/candidate-sources.json"
          docker run --rm "$image" cat /opt/crossforge/SOURCE-OFFER \
            > "$RUNNER_TEMP/candidate-source-offer.txt"
          grep -F "${{ steps.inputs.outputs.source_digest }}" \
            "$RUNNER_TEMP/candidate-source-offer.txt"
          grep -F "${{ steps.inputs.outputs.archive_sha256 }}" \
            "$RUNNER_TEMP/candidate-source-offer.txt"
          docker run --rm "$image" cat /opt/crossforge/LICENSES.json \
            > "$RUNNER_TEMP/candidate-licenses.json"
          jq -e --slurpfile source "$RUNNER_TEMP/source-binding.json" '
            .kind == "crossforge-license-file-inventory" and
            .status == "file-inventory-not-legal-conclusion" and
            .release_sha256 == $source[0].release_sha256 and
            .entry_count == (.entries | length) and
            any(.entries[]; .path | startswith("/usr/share/licenses/")) and
            any(.entries[]; .path | startswith("/opt/crossforge/host-tools/")) and
            any(.entries[]; .path | startswith("/opt/crossforge/python/")) and
            any(.entries[]; .path | startswith("/opt/crossforge/sysroots/")) and
            any(.entries[]; .path | startswith("/opt/crossforge/vcpkg/")) and
            any(.entries[]; .path | startswith("/opt/crossforge/share/licenses/crossforge/"))
          ' "$RUNNER_TEMP/candidate-licenses.json" >/dev/null
          docker run --rm "$image" crossforge --version \
            | grep -E '^crossforge (0|[1-9][0-9]*)\.'
          docker run --rm --read-only \
            --tmpfs /tmp:rw,uid=1000,gid=1000,mode=1777 \
            --tmpfs /home/crossforge:rw,uid=1000,gid=1000,mode=0700 \
            "$image" \
            crossforge env --target aarch64 --vcpkg --json \
            > "$RUNNER_TEMP/candidate-environment.json"
          grep -F '"kind": "crossforge-environment"' \
            "$RUNNER_TEMP/candidate-environment.json"
          grep -F '"VCPKG_DOWNLOADS": "/home/crossforge/.cache/crossforge/vcpkg/downloads"' \
            "$RUNNER_TEMP/candidate-environment.json"
          ! grep -F '/opt/crossforge/vcpkg/root/downloads' \
            "$RUNNER_TEMP/candidate-environment.json"
      - name: Build downstream consumers through the public launcher
        env:
          CANDIDATE_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image="$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST"
          consumer_root="$RUNNER_TEMP/public-launcher-consumer"
          install -d -m 0755 "$consumer_root"
          sudo chown 1000:1000 "$consumer_root"
          docker_arguments=(
            run --rm --pull=never --read-only
            --tmpfs /tmp:rw,uid=1000,gid=1000,mode=1777
            --tmpfs /home/crossforge:rw,uid=1000,gid=1000,mode=0700
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/consumer,dst=/source,readonly"
            --mount "type=bind,src=$consumer_root,dst=/workspace"
          )
          for target in x86_64 aarch64; do
            case "$target" in
              x86_64)
                triple=x86_64-unknown-linux-gnu
                machine='Advanced Micro Devices X86-64'
                ;;
              aarch64)
                triple=aarch64-unknown-linux-gnu
                machine=AArch64
                ;;
            esac
            build="/workspace/build-$target"
            docker "${docker_arguments[@]}" "$image" \
              crossforge run --target "$target" -- \
              cmake -S /source -B "$build" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release
            docker "${docker_arguments[@]}" "$image" \
              crossforge run --target "$target" -- \
              cmake --build "$build" --verbose
            test -f "$consumer_root/build-$target/crossforge-consumer"
            docker "${docker_arguments[@]}" "$image" \
              crossforge run --target "$target" -- \
              "/opt/crossforge/targets/$triple/bin/$triple-readelf" \
              -h "$build/crossforge-consumer" \
              > "$RUNNER_TEMP/$target-readelf.txt"
            grep -F "Machine:" "$RUNNER_TEMP/$target-readelf.txt" \
              | grep -F "$machine"
          done
      - name: Build native AArch64 probes from the immutable candidate
        id: native_probe
        env:
          CANDIDATE_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image="$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST"
          probe_root="$RUNNER_TEMP/native-aarch64-probes"
          install -d -m 0755 "$probe_root"
          sudo chown 1000:1000 "$probe_root"
          qualification_component_sha256=$(jq -r \
            '.components[] | select(.component == "toolchain/aarch64-qualification") | .canonical_sha256' \
            config/generated/release-binding.json)
          test "${#qualification_component_sha256}" -eq 64
          docker run --rm --pull=always --network none --read-only \
            --tmpfs /tmp:rw,uid=1000,gid=1000,mode=1777 \
            --tmpfs /home/crossforge:rw,uid=1000,gid=1000,mode=0700 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$probe_root,dst=/output" \
            "$image" \
            /usr/libexec/platform-python /src/scripts/qualify-toolchain.py \
              --prefix /opt/crossforge/targets/aarch64-unknown-linux-gnu \
              --sysroot /opt/crossforge/sysroots/el8/aarch64 \
              --target aarch64-unknown-linux-gnu \
              --work /output/artifacts \
              --report /output/compile-report.json \
              --release /opt/crossforge/release.json \
              --abi-baseline /src/abi/el8/aarch64.json \
              --qualification-component-sha256 \
                "$qualification_component_sha256" \
              --skip-sysroot-execution
          ./scripts/native-aarch64-release.py bundle \
            --candidate "$RUNNER_TEMP/candidate.json" \
            --compile-report "$probe_root/compile-report.json" \
            --artifacts "$probe_root/artifacts" \
            --output "$RUNNER_TEMP/native-aarch64-probes.tar"
          bundle_sha256=$(sha256sum \
            "$RUNNER_TEMP/native-aarch64-probes.tar" | awk '{print $1}')
          test "${#bundle_sha256}" -eq 64
          printf 'bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_OUTPUT"
      - name: Stage immutable candidate identity
        env:
          IDENTITY_ROOT: ${{ runner.temp }}/candidate-identity
        run: |
          set -Eeuo pipefail
          install -d -m 0755 "$IDENTITY_ROOT"
          install -m 0644 "$RUNNER_TEMP/candidate.json" \
            "$IDENTITY_ROOT/candidate.json"
          install -m 0644 \
            "$RUNNER_TEMP/source-bundle-identity/source-bundle.json" \
            "$IDENTITY_ROOT/source-bundle.json"
          install -m 0644 "$RUNNER_TEMP/source-binding.json" \
            "$IDENTITY_ROOT/source-binding.json"
          install -m 0644 "$RUNNER_TEMP/source-attestations.json" \
            "$IDENTITY_ROOT/source-attestations.json"
          install -m 0644 "$RUNNER_TEMP/sdk-attestations.json" \
            "$IDENTITY_ROOT/sdk-attestations.json"
          install -m 0644 "$RUNNER_TEMP/sbom-generator-image.json" \
            "$IDENTITY_ROOT/sbom-generator-image.json"
          install -m 0644 "$RUNNER_TEMP/component-selection.json" \
            "$IDENTITY_ROOT/component-selection.json"
          test "$(find "$IDENTITY_ROOT" -mindepth 1 -maxdepth 1 \
            -type f | wc -l)" -eq 7
      - name: Upload immutable candidate identity
        id: identity_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-identity/
          if-no-files-found: error
          retention-days: 90
      - name: Upload native AArch64 probe bundle
        id: probe_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-aarch64-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/native-aarch64-probes.tar
          if-no-files-found: error
          retention-days: 90
      - name: Report public candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.inputs.outputs.digest }}
          CANDIDATE_REFERENCE: ${{ steps.inputs.outputs.reference }}
          PLATFORM_DIGEST: ${{ steps.inputs.outputs.platform_digest }}
          SOURCE_DIGEST: ${{ steps.inputs.outputs.source_digest }}
          SOURCE_REFERENCE: ${{ steps.inputs.outputs.source_reference }}
        run: |
          set -Eeuo pipefail
          {
            echo '### Public Crossforge candidate'
            echo
            echo "- Tag: \`$CANDIDATE_REFERENCE\`"
            echo "- OCI index: \`$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST\`"
            echo "- linux/amd64 manifest: \`$PLATFORM_DIGEST\`"
            echo "- Source tag: \`$SOURCE_REFERENCE\`"
            echo "- Source OCI index: \`$CANDIDATE_REPOSITORY@$SOURCE_DIGEST\`"
            echo "- Source archive SHA256: \`${{ steps.inputs.outputs.archive_sha256 }}\`"
            echo "- Source archive bytes: \`${{ steps.inputs.outputs.archive_size }}\`"
            echo '- Status: public candidate; no stable or SemVer tag was created'
          } >> "$GITHUB_STEP_SUMMARY"
      # Dockerfile frontend stderr goes to the BuildKit daemon, so the Bake
      # progress log alone can contain only the frontend's exit code.
      - name: Collect publish build diagnostics
        if: always()
        run: |
          ./scripts/collect-buildkit-diagnostics.sh \
            "$RUNNER_TEMP/build-diagnostics/publish"
      - name: Preserve publish build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-diagnostics/publish/
          if-no-files-found: warn
          retention-days: 7

  native-aarch64:
    needs: [publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      native_attempt: ${{ steps.native_identity.outputs.attempt }}
      native_report_sha256: ${{ steps.native_identity.outputs.report_sha256 }}
      native_artifact_id: ${{ steps.native_artifact.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the original successful publisher
        env:
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/candidate-recovery.py upstream --stage native --needs-json "$UPSTREAM_JOBS"
      - name: Download immutable native probe bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish.outputs.probe_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-aarch64-input
      - name: Execute probes in pinned native Rocky AArch64
        env:
          CANDIDATE_DIGEST: ${{ needs.publish.outputs.candidate_digest }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.publish.outputs.probe_bundle_sha256 }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ARCH" = ARM64
          host_machine=$(uname -m)
          test "$host_machine" = aarch64
          candidate="$RUNNER_TEMP/native-aarch64-input/candidate.json"
          bundle="$RUNNER_TEMP/native-aarch64-input/native-aarch64-probes.tar"
          test "$(jq -r .digest "$candidate")" = "$CANDIDATE_DIGEST"
          ./scripts/candidate_manifest.py validate "$candidate" \
            --expected-source-commit "$GITHUB_SHA"
          runtime_repository=$(jq -r .base_image.repository config/release.json)
          runtime_tag=$(jq -r .base_image.tag config/release.json)
          runtime_manifest=$(jq -r \
            .base_image.manifests.arm64 config/release.json)
          runtime_reference="$runtime_repository:$runtime_tag@$runtime_manifest"
          install -d "$RUNNER_TEMP/native-aarch64-output"
          docker pull --platform linux/arm64 "$runtime_reference"
          docker run --rm --pull=never --platform linux/arm64 \
            --network none --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/native-aarch64-input,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/native-aarch64-output,dst=/output" \
            "$runtime_reference" \
            /usr/libexec/platform-python \
              /src/scripts/native-aarch64-release.py execute \
              --candidate /input/candidate.json \
              --bundle /input/native-aarch64-probes.tar \
              --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
              --runner-label ubuntu-24.04-arm \
              --runner-arch "$RUNNER_ARCH" \
              --host-machine "$host_machine" \
              --runtime-reference "$runtime_reference" \
              --output /output/native-aarch64.json
          ./scripts/native-aarch64-release.py validate \
            --candidate "$candidate" \
            --bundle "$bundle" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --report "$RUNNER_TEMP/native-aarch64-output/native-aarch64.json"
      - name: Stage native AArch64 release evidence
        env:
          CANDIDATE_INPUT: ${{ runner.temp }}/native-aarch64-input/candidate.json
          NATIVE_OUTPUT: ${{ runner.temp }}/native-aarch64-output
          EVIDENCE_ROOT: ${{ runner.temp }}/native-aarch64-release-evidence
        run: |
          set -Eeuo pipefail
          install -d -m 0755 "$EVIDENCE_ROOT"
          for file in \
            "$CANDIDATE_INPUT" \
            "$NATIVE_OUTPUT/native-aarch64.json"; do
            test -f "$file" && test ! -L "$file"
            install -m 0644 "$file" "$EVIDENCE_ROOT/$(basename "$file")"
          done
          test "$(find "$EVIDENCE_ROOT" -mindepth 1 -maxdepth 1 \
            -type f | wc -l)" -eq 2
      - name: Preserve the native report producer
        id: native_identity
        run: |
          set -Eeuo pipefail
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'report_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/native-aarch64-release-evidence/native-aarch64.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload native AArch64 release evidence
        id: native_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-aarch64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-aarch64-release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Report native AArch64 qualification
        env:
          CANDIDATE_DIGEST: ${{ needs.publish.outputs.candidate_digest }}
        run: |
          set -Eeuo pipefail
          {
            echo '### Native AArch64 release qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST\`"
            echo '- Runner: `ubuntu-24.04-arm` (`ARM64`)'
            echo '- Runtime: pinned Rocky Linux 8.10 arm64 manifest'
            echo '- Status: native C/C++20/LTO/archive/libgcc/cross-DSO probes passed'
          } >> "$GITHUB_STEP_SUMMARY"

  sign-candidate:
    needs: [publish, native-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-locked-buildx
      - uses: ./.github/actions/configure-build-cache
      - name: Require the original successful candidate producers
        env:
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/candidate-recovery.py upstream --stage sign --needs-json "$UPSTREAM_JOBS"
      - name: Download immutable native probe bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish.outputs.probe_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-aarch64-probes
      - name: Download native release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.native-aarch64.outputs.native_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-aarch64-evidence
      - name: Download the original candidate component selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish.outputs.identity_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-identity
      - name: Export the TUF-authenticated Cosign tool
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/cosign-tool"
          docker buildx bake cosign-host-tool \
            --set "cosign-host-tool.output=type=local,dest=$output" \
            --progress=plain
          expected=$(jq -r .sigstore.verifier.binary.sha256 config/release.json)
          test "$(sha256sum "$output/cosign" | awk '{print $1}')" = "$expected"
          test -x "$output/cosign"
          ./scripts/validate-sigstore-report.py \
            "$output/sigstore-verification.json"
      - name: Revalidate candidate and native release evidence
        env:
          CANDIDATE_DIGEST: ${{ needs.publish.outputs.candidate_digest }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.publish.outputs.probe_bundle_sha256 }}
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          probes="$RUNNER_TEMP/native-aarch64-probes"
          evidence="$RUNNER_TEMP/native-aarch64-evidence"
          cmp "$probes/candidate.json" "$evidence/candidate.json"
          cmp "$RUNNER_TEMP/candidate-identity/candidate.json" "$evidence/candidate.json"
          ./scripts/candidate_manifest.py validate \
            "$evidence/candidate.json" \
            --expected-source-commit "$GITHUB_SHA"
          test "$(jq -r .digest "$evidence/candidate.json")" = \
            "$CANDIDATE_DIGEST"
          ./scripts/native-aarch64-release.py validate \
            --candidate "$evidence/candidate.json" \
            --bundle "$probes/native-aarch64-probes.tar" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --report "$evidence/native-aarch64.json"
          python3 scripts/candidate-recovery.py create \
            --needs-json "$UPSTREAM_JOBS" \
            --candidate "$evidence/candidate.json" \
            --native-report "$evidence/native-aarch64.json" \
            --component-selection "$RUNNER_TEMP/candidate-identity/component-selection.json" \
            --output "$RUNNER_TEMP/candidate-recovery.json"
      - name: Sign and anonymously verify the qualified candidate
        env:
          CANDIDATE_DIGEST: ${{ needs.publish.outputs.candidate_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          cosign="$RUNNER_TEMP/cosign-tool/cosign"
          image="$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST"
          candidate_manifest="$RUNNER_TEMP/native-aarch64-evidence/candidate.json"
          source_repository=$(jq -r .source_bundle.repository "$candidate_manifest")
          source_digest=$(jq -r .source_bundle.digest "$candidate_manifest")
          source_image="$source_repository@$source_digest"
          identity=$(jq -r .sigstore.signing.identity config/release.json)
          issuer=$(jq -r .sigstore.signing.oidc_issuer config/release.json)
          logged_in=0
          cleanup_registry_login() {
            if test "$logged_in" = 1; then
              docker logout ghcr.io >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_registry_login EXIT
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          logged_in=1
          "$cosign" sign --yes "$image"
          "$cosign" sign --yes "$source_image"
          docker logout ghcr.io
          logged_in=0
          trap - EXIT
          openssl base64 -d -A \
            -in evidence/sigstore/tuf/trusted_root.json.b64 \
            -out "$RUNNER_TEMP/trusted_root.json"
          "$cosign" verify \
            --trusted-root "$RUNNER_TEMP/trusted_root.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image" > "$RUNNER_TEMP/candidate-signature.json"
          "$cosign" verify \
            --trusted-root "$RUNNER_TEMP/trusted_root.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$source_image" > "$RUNNER_TEMP/source-bundle-signature.json"
          jq -e --arg repository "$CANDIDATE_REPOSITORY" \
            --arg digest "$CANDIDATE_DIGEST" \
            'length >= 1 and all(.[];
              .critical.identity."docker-reference" == $repository and
              .critical.image."docker-manifest-digest" == $digest)' \
            "$RUNNER_TEMP/candidate-signature.json" >/dev/null
          jq -e --arg repository "$source_repository" \
            --arg digest "$source_digest" \
            'length >= 1 and all(.[];
              .critical.identity."docker-reference" == $repository and
              .critical.image."docker-manifest-digest" == $digest)' \
            "$RUNNER_TEMP/source-bundle-signature.json" >/dev/null
      - name: Stage candidate signature evidence
        env:
          SIGNATURE_ROOT: ${{ runner.temp }}/candidate-signature-evidence
        run: |
          set -Eeuo pipefail
          install -d -m 0755 "$SIGNATURE_ROOT"
          for file in \
            "$RUNNER_TEMP/native-aarch64-evidence/candidate.json" \
            "$RUNNER_TEMP/candidate-recovery.json" \
            "$RUNNER_TEMP/candidate-signature.json" \
            "$RUNNER_TEMP/source-bundle-signature.json" \
            "$RUNNER_TEMP/cosign-tool/sigstore-verification.json"; do
            test -f "$file" && test ! -L "$file"
            install -m 0644 "$file" "$SIGNATURE_ROOT/$(basename "$file")"
          done
          test "$(find "$SIGNATURE_ROOT" -mindepth 1 -maxdepth 1 \
            -type f | wc -l)" -eq 5
      - name: Upload candidate signature evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-signature-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-signature-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Report signed public candidate
        env:
          CANDIDATE_DIGEST: ${{ needs.publish.outputs.candidate_digest }}
        run: |
          set -Eeuo pipefail
          {
            echo '### Signed public Crossforge candidate'
            echo
            echo "- Candidate: \`$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST\`"
            echo '- Source bundle: candidate manifest digest binding verified and signed'
            echo '- Identity: GitHub OIDC candidate workflow on `main`'
            echo '- Status: native-qualified and keyless-signed; no stable tag was created'
          } >> "$GITHUB_STEP_SUMMARY"
