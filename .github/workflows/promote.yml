name: stable promotion

concurrency:
  group: stable-promotion
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful public candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Optional existing version tag; must resolve to the candidate commit
        required: false
        type: string
      confirmation:
        description: Enter PROMOTE-v<version> from config/release.json
        required: true
        type: string
      immutable_releases_enabled:
        description: Confirm repository release immutability is enabled
        required: true
        type: boolean
        default: false
      private_vulnerability_reporting_enabled:
        description: Confirm private vulnerability reporting is enabled
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  CANDIDATE_REPOSITORY: ghcr.io/eglinuxer/crossforge

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Resolve the successful candidate run
        id: candidate_run
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "$CANDIDATE_RUN_ID" in
            ''|*[!0-9]*|0) echo 'candidate run ID must be a positive integer' >&2; exit 1 ;;
          esac
          metadata="$RUNNER_TEMP/candidate-run.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$metadata"
          jq -e --argjson run_id "$CANDIDATE_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" '
              .id == $run_id and
              .run_attempt >= 1 and
              (.event == "push" or .event == "workflow_dispatch") and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .path == ".github/workflows/candidate.yml" and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              (.head_sha | test("^[0-9a-f]{40}$"))
            ' "$metadata" >/dev/null
          printf 'attempt=%s\n' "$(jq -r .run_attempt "$metadata")" \
            >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(jq -r .head_sha "$metadata")" \
            >> "$GITHUB_OUTPUT"
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.candidate_run.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
      - name: Validate the promotion contract and confirmation
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate_run.outputs.head_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          IMMUTABLE_RELEASES_ENABLED: ${{ inputs.immutable_releases_enabled }}
          PRIVATE_REPORTING_ENABLED: ${{ inputs.private_vulnerability_reporting_enabled }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          if test -n "$RELEASE_TAG"; then
            test "$RELEASE_TAG" = "v$(jq -r .product.version config/release.json)"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$CANDIDATE_HEAD_SHA"
            git merge-base --is-ancestor "$CANDIDATE_HEAD_SHA" origin/main
          fi
          expected_confirmation="PROMOTE-v$(jq -r .product.version config/release.json)"
          test "$CONFIRMATION" = "$expected_confirmation"
          test "$IMMUTABLE_RELEASES_ENABLED" = true
          test "$PRIVATE_REPORTING_ENABLED" = true
          test "$(jq -r .product.image_repository config/release.json)" = \
            "$CANDIDATE_REPOSITORY"
          ./scripts/validate-release.py --require-locked
          ./scripts/validate-supply-chain-evidence.py
          ./scripts/validate-frozen-abi.py
          ./scripts/validate-python-runtime-providers.py
          ./scripts/validate-qt-runtime-qualification.py
          ./scripts/render-release-components.py --check
          ./scripts/render-vcpkg-integration.py --check
          ./scripts/render-bake.py --check
      - name: Validate the protected release control plane
        uses: ./.github/actions/validate-release-control-plane
        with:
          admin-token: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          output: ${{ runner.temp }}/release-control-plane.json
      - name: Download candidate signature evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-signature-${{ inputs.candidate_run_id }}-${{ steps.candidate_run.outputs.attempt }}
          path: ${{ runner.temp }}/candidate-signature
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Resolve the original candidate artifact producers
        id: recovery
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate_run.outputs.attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if test -f scripts/candidate-recovery.py; then
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/candidate-artifacts.json"
            python3 scripts/candidate-recovery.py select \
              --signature-directory "$RUNNER_TEMP/candidate-signature" \
              --candidate-run "$RUNNER_TEMP/candidate-run.json" \
              --artifacts "$RUNNER_TEMP/candidate-artifacts.json" \
              --expected-run-id "$CANDIDATE_RUN_ID"
          else
            # Legacy candidate source predates explicit producer lineage.
            printf 'identity_name=candidate-identity-%s-%s\n' "$CANDIDATE_RUN_ID" "$CANDIDATE_ATTEMPT" >> "$GITHUB_OUTPUT"
            printf 'probes_name=native-aarch64-probes-%s-%s\n' "$CANDIDATE_RUN_ID" "$CANDIDATE_ATTEMPT" >> "$GITHUB_OUTPUT"
            printf 'native_name=native-aarch64-evidence-%s-%s\n' "$CANDIDATE_RUN_ID" "$CANDIDATE_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - name: Download immutable candidate identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.recovery.outputs.identity_name }}
          artifact-ids: ${{ steps.recovery.outputs.identity_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-identity
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download immutable native probe bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.recovery.outputs.probes_name }}
          artifact-ids: ${{ steps.recovery.outputs.probes_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-aarch64-probes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download native release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.recovery.outputs.native_name }}
          artifact-ids: ${{ steps.recovery.outputs.native_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-aarch64-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Revalidate every candidate-bound evidence file
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate_run.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          identity="$RUNNER_TEMP/candidate-identity"
          probes="$RUNNER_TEMP/native-aarch64-probes"
          native="$RUNNER_TEMP/native-aarch64-evidence"
          signature="$RUNNER_TEMP/candidate-signature"
          candidate="$identity/candidate.json"
          cmp "$candidate" "$probes/candidate.json"
          cmp "$candidate" "$native/candidate.json"
          cmp "$candidate" "$signature/candidate.json"
          ./scripts/candidate_manifest.py validate "$candidate" \
            --expected-source-commit "$CANDIDATE_HEAD_SHA"
          ./scripts/source_binding.py validate "$identity/source-binding.json" \
            --expected-source-commit "$CANDIDATE_HEAD_SHA"
          jq --sort-keys .source_bundle "$candidate" \
            > "$RUNNER_TEMP/candidate-source-binding.json"
          jq --sort-keys \
            '{repository,digest,platform,platform_manifest_digest,archive}' \
            "$identity/source-binding.json" \
            > "$RUNNER_TEMP/artifact-source-binding.json"
          cmp "$RUNNER_TEMP/candidate-source-binding.json" \
            "$RUNNER_TEMP/artifact-source-binding.json"
          recreated="$RUNNER_TEMP/recreated-candidate.json"
          ./scripts/candidate_manifest.py create \
            --source-commit "$CANDIDATE_HEAD_SHA" \
            --digest "$(jq -r .digest "$candidate")" \
            --platform-manifest-digest \
              "$(jq -r .platform_manifest_digest "$candidate")" \
            --source-bundle-digest \
              "$(jq -r .source_bundle.digest "$candidate")" \
            --source-bundle-platform-manifest-digest \
              "$(jq -r .source_bundle.platform_manifest_digest "$candidate")" \
            --source-bundle-identity "$identity/source-bundle.json" \
            --output "$recreated"
          cmp "$candidate" "$recreated"
          expected_bundle_sha256=$(jq -r .bundle_sha256 \
            "$native/native-aarch64.json")
          ./scripts/native-aarch64-release.py validate \
            --candidate "$candidate" \
            --bundle "$probes/native-aarch64-probes.tar" \
            --expected-bundle-sha256 "$expected_bundle_sha256" \
            --report "$native/native-aarch64.json"
          ./scripts/validate-sigstore-report.py \
            "$signature/sigstore-verification.json"
      - name: Export the TUF-authenticated Cosign verifier
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/cosign-tool"
          mkdir -p "$output"
          docker buildx bake cosign-host-tool --allow="fs.write=$output" \
            --set "cosign-host-tool.output=type=local,dest=$output" \
            --progress=plain
          expected=$(jq -r .sigstore.verifier.binary.sha256 config/release.json)
          test "$(sha256sum "$output/cosign" | awk '{print $1}')" = "$expected"
          test -x "$output/cosign"
          ./scripts/validate-sigstore-report.py \
            "$output/sigstore-verification.json"
      - name: Verify public digests and signatures without credentials
        id: public_identity
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          candidate="$RUNNER_TEMP/candidate-identity/candidate.json"
          candidate_digest=$(jq -r .digest "$candidate")
          candidate_platform=$(jq -r .platform_manifest_digest "$candidate")
          source_repository=$(jq -r .source_bundle.repository "$candidate")
          source_digest=$(jq -r .source_bundle.digest "$candidate")
          source_platform=$(jq -r \
            .source_bundle.platform_manifest_digest "$candidate")
          candidate_image="$CANDIDATE_REPOSITORY@$candidate_digest"
          source_image="$source_repository@$source_digest"
          docker buildx imagetools inspect "$candidate_image" --raw \
            > "$RUNNER_TEMP/anonymous-candidate-index.json"
          test "$(./scripts/resolve_candidate_image.py platform-digest \
            --index "$RUNNER_TEMP/anonymous-candidate-index.json" \
            --expected-digest "$candidate_digest")" = "$candidate_platform"
          docker buildx imagetools inspect "$source_image" --raw \
            > "$RUNNER_TEMP/anonymous-source-index.json"
          test "$(./scripts/resolve_candidate_image.py platform-digest \
            --index "$RUNNER_TEMP/anonymous-source-index.json" \
            --expected-digest "$source_digest")" = "$source_platform"
          openssl base64 -d -A \
            -in evidence/sigstore/tuf/trusted_root.json.b64 \
            -out "$RUNNER_TEMP/trusted_root.json"
          cosign="$RUNNER_TEMP/cosign-tool/cosign"
          identity=$(jq -r .sigstore.signing.identity config/release.json)
          issuer=$(jq -r .sigstore.signing.oidc_issuer config/release.json)
          "$cosign" verify \
            --trusted-root "$RUNNER_TEMP/trusted_root.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$candidate_image" > "$RUNNER_TEMP/current-candidate-signature.json"
          "$cosign" verify \
            --trusted-root "$RUNNER_TEMP/trusted_root.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$source_image" > "$RUNNER_TEMP/current-source-signature.json"
          for evidence in \
            "$RUNNER_TEMP/candidate-signature/candidate-signature.json" \
            "$RUNNER_TEMP/current-candidate-signature.json"; do
            jq -e --arg repository "$CANDIDATE_REPOSITORY" \
              --arg digest "$candidate_digest" '
                length >= 1 and all(.[];
                  .critical.identity."docker-reference" == $repository and
                  .critical.image."docker-manifest-digest" == $digest)
              ' "$evidence" >/dev/null
          done
          for evidence in \
            "$RUNNER_TEMP/candidate-signature/source-bundle-signature.json" \
            "$RUNNER_TEMP/current-source-signature.json"; do
            jq -e --arg repository "$source_repository" \
              --arg digest "$source_digest" '
                length >= 1 and all(.[];
                  .critical.identity."docker-reference" == $repository and
                  .critical.image."docker-manifest-digest" == $digest)
              ' "$evidence" >/dev/null
          done
          printf 'candidate_digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'candidate_platform=%s\n' "$candidate_platform" >> "$GITHUB_OUTPUT"
          printf 'source_digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'source_platform=%s\n' "$source_platform" >> "$GITHUB_OUTPUT"
      - name: Revalidate public source provenance and SBOM
        uses: ./.github/actions/validate-public-attestations
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          index: ${{ runner.temp }}/anonymous-source-index.json
          index-digest: ${{ steps.public_identity.outputs.source_digest }}
          platform-digest: ${{ steps.public_identity.outputs.source_platform }}
          image-kind: source-bundle
          source-commit: ${{ steps.candidate_run.outputs.head_sha }}
          output: ${{ runner.temp }}/current-source-attestations.json
      - name: Revalidate public SDK provenance and SBOM
        uses: ./.github/actions/validate-public-attestations
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          index: ${{ runner.temp }}/anonymous-candidate-index.json
          index-digest: ${{ steps.public_identity.outputs.candidate_digest }}
          platform-digest: ${{ steps.public_identity.outputs.candidate_platform }}
          image-kind: sdk-candidate
          source-commit: ${{ steps.candidate_run.outputs.head_sha }}
          output: ${{ runner.temp }}/current-sdk-attestations.json
      - name: Match candidate-bound attestation reports
        run: |
          set -Eeuo pipefail
          cmp "$RUNNER_TEMP/candidate-identity/source-attestations.json" \
            "$RUNNER_TEMP/current-source-attestations.json"
          cmp "$RUNNER_TEMP/candidate-identity/sdk-attestations.json" \
            "$RUNNER_TEMP/current-sdk-attestations.json"
      - name: Revalidate the locked SBOM generator image and source identity
        uses: ./.github/actions/validate-sbom-generator
        with:
          output: ${{ runner.temp }}/current-sbom-generator-image.json
      - name: Match the candidate-bound SBOM generator report
        run: |
          set -Eeuo pipefail
          cmp "$RUNNER_TEMP/candidate-identity/sbom-generator-image.json" \
            "$RUNNER_TEMP/current-sbom-generator-image.json"
      - name: Create reproducible promotion evidence
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -Eeuo pipefail
          recovery=()
          if test -f "$RUNNER_TEMP/candidate-signature/candidate-recovery.json"; then
            recovery+=(--candidate-recovery "$RUNNER_TEMP/candidate-signature/candidate-recovery.json")
          fi
          ./scripts/release_promotion.py create \
            --candidate "$RUNNER_TEMP/candidate-identity/candidate.json" \
            --candidate-run "$RUNNER_TEMP/candidate-run.json" \
            --expected-github-repository "$GITHUB_REPOSITORY" \
            --expected-candidate-run-id "$CANDIDATE_RUN_ID" \
            "${recovery[@]}" \
            --output "$RUNNER_TEMP/release-promotion.json"
          ./scripts/release_promotion.py validate \
            "$RUNNER_TEMP/release-promotion.json"
      - name: Assemble deterministic durable release evidence
        id: release_evidence
        run: |
          set -Eeuo pipefail
          identity="$RUNNER_TEMP/candidate-identity"
          probes="$RUNNER_TEMP/native-aarch64-probes"
          native="$RUNNER_TEMP/native-aarch64-evidence"
          signature="$RUNNER_TEMP/candidate-signature"
          assets="$RUNNER_TEMP/release-assets"
          version=$(jq -r .product.version config/release.json)
          archive="$assets/crossforge-v$version-release-evidence.tar"
          checksum="$archive.sha256"
          install -d -m 0755 "$assets"
          ./scripts/release_evidence.py create \
            --candidate-signature "$signature/candidate-signature.json" \
            --candidate "$identity/candidate.json" \
            --native-probe-bundle "$probes/native-aarch64-probes.tar" \
            --native-report "$native/native-aarch64.json" \
            --promotion "$RUNNER_TEMP/release-promotion.json" \
            --release config/release.json \
            --sdk-attestations "$identity/sdk-attestations.json" \
            --sbom-generator-image "$identity/sbom-generator-image.json" \
            --trusted-root "$RUNNER_TEMP/trusted_root.json" \
            --sigstore-report "$signature/sigstore-verification.json" \
            --source-attestations "$identity/source-attestations.json" \
            --source-binding "$identity/source-binding.json" \
            --source-signature "$signature/source-bundle-signature.json" \
            --source-bundle-identity "$identity/source-bundle.json" \
            --output "$archive" \
            --sha256-output "$checksum"
          ./scripts/release_evidence.py validate "$archive" \
            --sha256 "$checksum"
          install -m 0644 "$identity/candidate.json" "$assets/candidate.json"
          install -m 0644 "$RUNNER_TEMP/release-promotion.json" \
            "$assets/release-promotion.json"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          printf 'assets=%s\n' "$assets" >> "$GITHUB_OUTPUT"
      - name: Preflight the immutable GitHub release
        id: github_release
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate_run.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          api_status() {
            local endpoint=$1
            local output=$2
            local status
            if ! status=$(curl --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -o "$output" -w '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$endpoint"); then
              echo "GitHub API request failed: $endpoint" >&2
              return 1
            fi
            printf '%s\n' "$status"
          }
          version=$(jq -r .product.version config/release.json)
          tag="v$version"
          ref="$RUNNER_TEMP/release-tag.json"
          ref_status=$(api_status "git/ref/tags/$tag" "$ref")
          case "$ref_status" in
            200)
              object_type=$(jq -r .object.type "$ref")
              object_sha=$(jq -r .object.sha "$ref")
              if test "$object_type" = tag; then
                annotated="$RUNNER_TEMP/annotated-release-tag.json"
                test "$(api_status "git/tags/$object_sha" "$annotated")" = 200
                test "$(jq -r .object.type "$annotated")" = commit
                object_sha=$(jq -r .object.sha "$annotated")
              else
                test "$object_type" = commit
              fi
              test "$object_sha" = "$CANDIDATE_HEAD_SHA"
              tag_exists=true
              ;;
            404) tag_exists=false ;;
            *) echo "unexpected Git tag status: $ref_status" >&2; exit 1 ;;
          esac
          release="$RUNNER_TEMP/github-release.json"
          release_status=$(api_status "releases/tags/$tag" "$release")
          case "$release_status" in
            200)
              jq -e --arg tag "$tag" --arg head "$CANDIDATE_HEAD_SHA" '
                .tag_name == $tag and
                .target_commitish == $head and
                .prerelease == false and
                ((.draft == true and .immutable == false) or
                 (.draft == false and .immutable == true))
              ' "$release" >/dev/null
              if test "$(jq -r .draft "$release")" = true; then
                release_state=draft
              else
                test "$tag_exists" = true
                release_state=published
              fi
              ;;
            404)
              release_state=absent
              ;;
            *) echo "unexpected GitHub release status: $release_status" >&2; exit 1 ;;
          esac
          printf 'state=%s\n' "$release_state" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'tag_exists=%s\n' "$tag_exists" >> "$GITHUB_OUTPUT"
      - name: Create or resume the immutable release draft
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate_run.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ steps.github_release.outputs.state }}
          RELEASE_TAG: ${{ steps.github_release.outputs.tag }}
          RELEASE_TAG_EXISTS: ${{ steps.github_release.outputs.tag_exists }}
        run: |
          set -Eeuo pipefail
          assets="$RUNNER_TEMP/release-assets"
          candidate="$assets/candidate.json"
          promotion="$assets/release-promotion.json"
          archive="${{ steps.release_evidence.outputs.archive }}"
          checksum="${{ steps.release_evidence.outputs.checksum }}"
          notes="$RUNNER_TEMP/release-notes.md"
          candidate_digest=$(jq -r .digest "$candidate")
          source_repository=$(jq -r .source_bundle.repository "$candidate")
          source_digest=$(jq -r .source_bundle.digest "$candidate")
          candidate_run=$(jq -r .candidate_run.url "$promotion")
          {
            echo "# Crossforge $RELEASE_TAG"
            echo
            echo 'GTS-derived cross SDK built from Rocky Linux rebuild sources.'
            echo
            echo "- SDK: \`$CANDIDATE_REPOSITORY@$candidate_digest\`"
            echo "- Source: \`$source_repository@$source_digest\`"
            echo "- Qualified candidate run: $candidate_run"
            echo
            echo 'The SDK and source OCI digests were natively qualified on AArch64,'
            echo 'verified with the pinned Sigstore trust root, and promoted without rebuilding.'
            echo 'Download the evidence archive and run `sha256sum -c` against its sidecar.'
            echo 'The archive `MANIFEST.json` binds every included evidence file.'
          } > "$notes"
          if test "$RELEASE_STATE" = absent; then
            create_arguments=(
              "$RELEASE_TAG"
              --draft
              --target "$CANDIDATE_HEAD_SHA"
              --title "Crossforge $RELEASE_TAG"
              --notes-file "$notes"
            )
            if test "$RELEASE_TAG_EXISTS" = true; then
              create_arguments+=(--verify-tag)
            fi
            gh release create "${create_arguments[@]}"
          fi
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/github-release-current.json"
          release="$RUNNER_TEMP/github-release-current.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .prerelease == false' "$release" >/dev/null
          if test "$RELEASE_STATE" != published; then
            test "$(jq -r .draft "$release")" = true
          fi
          allowed=$(jq -cn --args '$ARGS.positional | sort' \
            "$(basename "$archive")" \
            "$(basename "$checksum")" \
            "$(basename "$candidate")" \
            "$(basename "$promotion")")
          test "$(jq --argjson allowed "$allowed" \
            '[.assets[].name] - $allowed | length' "$release")" -eq 0
          ensure_asset() {
            local path=$1
            local name
            local expected_digest
            local expected_size
            local matches
            name=$(basename "$path")
            expected_digest="sha256:$(sha256sum "$path" | awk '{print $1}')"
            expected_size=$(stat -c '%s' "$path")
            gh api -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              > "$release"
            matches=$(jq --arg name "$name" \
              '[.assets[] | select(.name == $name)] | length' "$release")
            case "$matches" in
              0)
                test "$(jq -r .draft "$release")" = true
                gh release upload "$RELEASE_TAG" "$path"
                ;;
              1)
                jq -e --arg name "$name" \
                  --arg digest "$expected_digest" \
                  --argjson size "$expected_size" '
                    any(.assets[];
                      .name == $name and .state == "uploaded" and
                      .digest == $digest and .size == $size)
                  ' "$release" >/dev/null
                ;;
              *) echo "duplicate release asset: $name" >&2; return 1 ;;
            esac
          }
          for path in "$archive" "$checksum" "$candidate" "$promotion"; do
            ensure_asset "$path"
          done
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$release"
          test "$(jq -c '[.assets[].name] | sort' "$release")" = "$allowed"
      - name: Promote only the verified digests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/candidate-identity/candidate.json"
          candidate_digest=$(jq -r .digest "$candidate")
          source_digest=$(jq -r .source_bundle.digest "$candidate")
          version=$(jq -r .product.version config/release.json)
          channel=$(jq -r .product.stable_channel config/release.json)
          version_tag="v${version/+/_}"
          candidate_version="$CANDIDATE_REPOSITORY:$version_tag"
          candidate_channel="$CANDIDATE_REPOSITORY:$channel"
          source_version="$CANDIDATE_REPOSITORY:source-$version_tag"
          source_channel="$CANDIDATE_REPOSITORY:source-$channel"
          registry_path=${CANDIDATE_REPOSITORY#ghcr.io/}
          registry_token=$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$registry_path:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')
          public_tag_digest() {
            local reference=$1
            local tag=${reference##*:}
            local output="$RUNNER_TEMP/registry-$tag.json"
            local status
            if ! status=$(curl --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              -o "$output" -w '%{http_code}' \
              "https://ghcr.io/v2/$registry_path/manifests/$tag"); then
              echo "registry request failed for $reference" >&2
              return 1
            fi
            case "$status" in
              200) printf 'sha256:%s\n' "$(sha256sum "$output" | awk '{print $1}')" ;;
              404) printf 'absent\n' ;;
              *) echo "registry returned HTTP $status for $reference" >&2; return 1 ;;
            esac
          }
          promote_tag() {
            local target=$1
            local digest=$2
            local immutable=$3
            local current
            current=$(public_tag_digest "$target")
            if test "$current" = "$digest"; then
              echo "tag already resolves to the selected digest: $target"
              return
            fi
            if test "$immutable" = true && test "$current" != absent; then
              echo "refusing to replace immutable version tag $target ($current)" >&2
              return 1
            fi
            docker buildx imagetools create \
              --tag "$target" "$CANDIDATE_REPOSITORY@$digest"
          }
          candidate_version_state=$(public_tag_digest "$candidate_version")
          case "$candidate_version_state" in
            absent|"$candidate_digest") ;;
            *) echo "immutable version tag differs: $candidate_version" >&2; exit 1 ;;
          esac
          source_version_state=$(public_tag_digest "$source_version")
          case "$source_version_state" in
            absent|"$source_digest") ;;
            *) echo "immutable version tag differs: $source_version" >&2; exit 1 ;;
          esac
          logged_in=0
          cleanup_registry_login() {
            if test "$logged_in" = 1; then
              docker logout ghcr.io >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_registry_login EXIT
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          logged_in=1
          promote_tag "$source_version" "$source_digest" true
          promote_tag "$candidate_version" "$candidate_digest" true
          promote_tag "$source_channel" "$source_digest" false
          promote_tag "$candidate_channel" "$candidate_digest" false
          docker logout ghcr.io
          logged_in=0
          trap - EXIT
          for reference_digest in \
            "$source_version@$source_digest" \
            "$candidate_version@$candidate_digest" \
            "$source_channel@$source_digest" \
            "$candidate_channel@$candidate_digest"; do
            reference=${reference_digest%@*}
            expected=${reference_digest##*@}
            test "$(public_tag_digest "$reference")" = "$expected"
          done
      - name: Publish and verify the immutable GitHub release
        id: published_release
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate_run.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ steps.github_release.outputs.state }}
          RELEASE_TAG: ${{ steps.github_release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if test "$RELEASE_STATE" != published; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          release="$RUNNER_TEMP/github-release-published.json"
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$release"
          jq -e --arg tag "$RELEASE_TAG" --arg head "$CANDIDATE_HEAD_SHA" '
            .tag_name == $tag and
            .target_commitish == $head and
            .draft == false and
            .prerelease == false and
            .immutable == true and
            (.assets | length) == 4 and
            all(.assets[];
              .state == "uploaded" and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              .size > 0)
          ' "$release" >/dev/null
          printf 'release_url=%s\n' "$(jq -r .html_url "$release")" \
            >> "$GITHUB_OUTPUT"
      - name: Upload stable promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-promotion.json
          if-no-files-found: error
          retention-days: 90
      - name: Report stable release
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/release-promotion.json"
          {
            echo '### Stable Crossforge release'
            echo
            echo "- Version: \`$(jq -r .release.version "$evidence")\`"
            echo "- Candidate: \`$(jq -r .candidate.version_reference "$evidence")\`"
            echo "- Stable channel: \`$(jq -r .candidate.channel_reference "$evidence")\`"
            echo "- OCI digest: \`$(jq -r .candidate.digest "$evidence")\`"
            echo "- Source: \`$(jq -r .source_bundle.version_reference "$evidence")\`"
            echo "- Candidate run: $(jq -r .candidate_run.url "$evidence")"
            echo "- Immutable release: ${{ steps.published_release.outputs.release_url }}"
            echo '- Status: exact signed digest promoted without rebuilding'
          } >> "$GITHUB_STEP_SUMMARY"
