name: Replay selected qualification gates

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Re-execute this gate from authenticated existing build components
        type: choice
        options: [toolchain-x86_64, toolchain-aarch64, gcc-smoke, gcc-full, python-cp39, python-cp310, python-cp311, python-cp312, python-cp313, python-cp314, vcpkg, sdk]
        default: gcc-smoke

permissions:
  contents: read

concurrency:
  group: qualification-replay-${{ github.ref }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/verify-quick.yml
    with:
      plan-components: false

  replay:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require the trusted main source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SERVER_URL" = https://github.com
          test "$GITHUB_REPOSITORY" = eglinuxer/crossforge
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/run-build-stage
        with:
          stage: ${{ inputs.stage }}
          component-reader: true
          component-builder: ${{ steps.buildx.outputs.builder }}
          python-components: ${{ startsWith(inputs.stage, 'python-') || inputs.stage == 'sdk' }}
          replay-qualification: true
