# Builds every supported toolchain combination on each commit to main and
# publishes ready-to-use Docker images to GHCR:
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>            (default gcc)
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>-gcc<ver>   (all)
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>-gcc<ver>-<sha>
name: toolchain-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: toolchain-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        gcc: ["14.2.1", "11.2.1"]
        baseline: [el8, el7]
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Build crossforge
        run: cargo build --release

      - name: Build el8 build environment image
        run: docker build -t crossforge-buildenv:el8 -f docker/buildenv.Dockerfile docker

      - name: Build toolchain (gcc ${{ matrix.gcc }}, ${{ matrix.baseline }}, ${{ matrix.target }})
        run: |
          ./target/release/crossforge build \
            --gcc ${{ matrix.gcc }} \
            --baseline ${{ matrix.baseline }} \
            --target ${{ matrix.target }} \
            --image crossforge-buildenv:el8 \
            --work-dir "$PWD/work"

      - name: Audit smoke test
        run: |
          ID=$(ls work/toolchains)
          printf '#include <stdio.h>\nint main(){puts("ok");return 0;}\n' > smoke.c
          "work/toolchains/$ID/bin/${{ matrix.target }}-unknown-linux-gnu-gcc" smoke.c -o smoke
          ./target/release/crossforge audit \
            --sysroot "work/sysroots/${{ matrix.baseline }}-${{ matrix.target }}" \
            --arch ${{ matrix.target }} smoke

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        run: |
          ID=$(ls work/toolchains)
          GCC=${ID%%-*}   # e.g. gcc14.2.1
          SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${{ github.repository }}/toolchain"
          TAG="${{ matrix.baseline }}-${{ matrix.target }}"
          TAGS=(-t "$IMAGE:$TAG-$GCC" -t "$IMAGE:$TAG-$GCC-$SHA")
          # The default compiler also owns the short baseline-target tag.
          if [ "${{ matrix.gcc }}" = "14.2.1" ]; then
            TAGS+=(-t "$IMAGE:$TAG")
          fi
          docker build -f docker/toolchain.Dockerfile \
            --build-arg TOOLCHAIN_ID="$ID" \
            "${TAGS[@]}" work/toolchains
          docker push --all-tags "$IMAGE"
