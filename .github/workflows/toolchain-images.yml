# Builds every supported toolchain combination on each commit to main and
# publishes ready-to-use Docker images to GHCR:
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>            (default gcc)
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>-gcc<ver>   (all)
#   ghcr.io/<owner>/<repo>/toolchain:<baseline>-<target>-gcc<ver>-<sha>
name: toolchain-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: toolchain-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        gcc: ["14.2.1", "11.2.1"]
        baseline: [el8, el7]
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Build crossforge
        run: cargo build --release

      - name: Build el8 build environment image
        run: docker build -t crossforge-buildenv:el8 -f docker/buildenv.Dockerfile docker

      - name: Build toolchain (gcc ${{ matrix.gcc }}, ${{ matrix.baseline }}, ${{ matrix.target }})
        run: |
          ./target/release/crossforge build \
            --gcc ${{ matrix.gcc }} \
            --baseline ${{ matrix.baseline }} \
            --target ${{ matrix.target }} \
            --image crossforge-buildenv:el8 \
            --work-dir "$PWD/work"

      - name: Audit smoke test
        run: |
          ID=$(ls work/toolchains)
          printf '#include <stdio.h>\nint main(){puts("ok");return 0;}\n' > smoke.c
          "work/toolchains/$ID/bin/${{ matrix.target }}-unknown-linux-gnu-gcc" smoke.c -o smoke
          ./target/release/crossforge audit \
            --sysroot "work/sysroots/${{ matrix.baseline }}-${{ matrix.target }}" \
            --arch ${{ matrix.target }} smoke

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        run: |
          ID=$(ls work/toolchains)
          GCC=${ID%%-*}   # e.g. gcc14.2.1
          SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${{ github.repository }}/toolchain"
          TAG="${{ matrix.baseline }}-${{ matrix.target }}"
          TAGS=(-t "$IMAGE:$TAG-$GCC" -t "$IMAGE:$TAG-$GCC-$SHA")
          # The default compiler also owns the short baseline-target tag.
          if [ "${{ matrix.gcc }}" = "14.2.1" ]; then
            TAGS+=(-t "$IMAGE:$TAG")
          fi
          docker build -f docker/toolchain.Dockerfile \
            --build-arg TOOLCHAIN_ID="$ID" \
            "${TAGS[@]}" work/toolchains
          docker push --all-tags "$IMAGE"

  # Cross build environments (design doc §5.5): the target cross toolchain
  # plus the x86_64 native companion in one image, composed from this
  # commit's published toolchain images by digest. This is the unit a real
  # cross build needs — host tools (moc, protoc, ...) must be built natively
  # before the target artifacts can be cross-compiled.
  crossenv:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        baseline: [el8, el7]
        target: [aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose and push the cross build environment
        run: |
          SHA=${GITHUB_SHA::7}
          TOOLCHAIN="ghcr.io/${{ github.repository }}/toolchain"
          CROSSENV="ghcr.io/${{ github.repository }}/crossenv"
          HOST_ID="gcc14.2.1-${{ matrix.baseline }}-x86_64"
          TARGET_ID="gcc14.2.1-${{ matrix.baseline }}-${{ matrix.target }}"
          # Pin both inputs by digest, not by tag.
          HOST_REF="$TOOLCHAIN:${{ matrix.baseline }}-x86_64-gcc14.2.1-$SHA"
          TARGET_REF="$TOOLCHAIN:${{ matrix.baseline }}-${{ matrix.target }}-gcc14.2.1-$SHA"
          HOST_DIGEST=$(docker buildx imagetools inspect "$HOST_REF" --format '{{.Manifest.Digest}}')
          TARGET_DIGEST=$(docker buildx imagetools inspect "$TARGET_REF" --format '{{.Manifest.Digest}}')
          echo "host:   $TOOLCHAIN@$HOST_DIGEST"
          echo "target: $TOOLCHAIN@$TARGET_DIGEST"
          TAG="${{ matrix.baseline }}-${{ matrix.target }}"
          docker build -f docker/crossenv.Dockerfile \
            --build-arg HOST_IMAGE="$TOOLCHAIN@$HOST_DIGEST" \
            --build-arg TARGET_IMAGE="$TOOLCHAIN@$TARGET_DIGEST" \
            --build-arg HOST_ID="$HOST_ID" \
            --build-arg TARGET_ID="$TARGET_ID" \
            --build-arg BASELINE="${{ matrix.baseline }}" \
            --build-arg SYSROOT_PROFILE="minimal" \
            -t "$CROSSENV:$TAG" -t "$CROSSENV:$TAG-$SHA" .
          docker push --all-tags "$CROSSENV"

      - name: Verify both toolchains in the composed image
        run: |
          TAG="${{ matrix.baseline }}-${{ matrix.target }}"
          CROSSENV="ghcr.io/${{ github.repository }}/crossenv:$TAG"
          cat > /tmp/hello.cpp <<'EOF'
          #include <string>
          #include <cstdio>
          int main() { std::string s = "ok"; std::printf("%s\n", s.c_str()); }
          EOF
          docker run --rm -v /tmp:/w -w /w "$CROSSENV" sh -c '
            set -e
            # The bare driver must be the native companion, not the distro gcc.
            test "$(gcc -dumpfullversion)" = "14.2.1"
            gcc -dumpmachine | grep -q x86_64
            # Host-side build tool, natively compiled and executed.
            g++ -std=c++17 hello.cpp -o hello_host && ./hello_host
            # Target artifact from the same environment.
            ${{ matrix.target }}-unknown-linux-gnu-g++ -std=c++17 hello.cpp -o hello_target
            file hello_target | grep -qi aarch64
            cmake --version | head -1
            echo "crossenv OK"'

  # Python packs (design doc §9): built from this commit's toolchains and
  # published per (version, arch) — an image users can `docker run` directly
  # or feed to `crossforge python --pull`, plus tar.zst release assets on
  # tags. This is what removes the local CPython build from a wheel run.
  python-packs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9.25", "3.10.21", "3.11.16", "3.12.14", "3.13.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Build crossforge
        run: cargo build --release

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch this commit's el8 toolchains from GHCR
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${{ github.repository }}/toolchain"
          mkdir -p work/toolchains
          for target in x86_64 aarch64; do
            ID="gcc14.2.1-el8-$target"
            docker pull -q "$IMAGE:el8-$target-gcc14.2.1-$SHA"
            cid=$(docker create "$IMAGE:el8-$target-gcc14.2.1-$SHA")
            docker cp "$cid:/opt/crossforge/$ID" "work/toolchains/$ID"
            docker rm "$cid" >/dev/null
          done

      - name: Build el8 build environment image
        run: docker build -t crossforge-buildenv:el8 -f docker/buildenv.Dockerfile docker

      - name: Build packs (${{ matrix.python }}, both arches)
        run: |
          ./target/release/crossforge python \
            --versions "${{ matrix.python }}" \
            --image crossforge-buildenv:el8 --work-dir "$PWD/work"

      - name: Push pack images
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${{ github.repository }}/python"
          VERSION="${{ matrix.python }}"
          TAG="cp$(echo "$VERSION" | cut -d. -f1,2 | tr -d .)"
          for arch in x86_64 aarch64; do
            platform=linux/amd64
            [ "$arch" = aarch64 ] && platform=linux/arm64
            # COPY-only build: the arm64 variant needs no emulation.
            docker build -f docker/python.Dockerfile --platform "$platform" \
              --build-arg PACK_ID="$TAG-$arch" --build-arg PYTHON_VERSION="$VERSION" \
              -t "$IMAGE:$TAG-$arch" -t "$IMAGE:$TAG-$arch-$SHA" work/python-packs
          done
          docker push --all-tags "$IMAGE"

      - name: Pack release assets and upload (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/crossforge python \
            --versions "${{ matrix.python }}" --pack \
            --image crossforge-buildenv:el8 --work-dir "$PWD/work" --out "$PWD/dist"
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --notes "crossforge $TAG" || true
          gh release upload "$TAG" dist/*.tar.zst dist/*.python.toml --clobber

  # Wheel dimension (design doc §9, M8): the sample wheels through
  # audit/vendor/smoke and the official manylinux containers, on packs
  # pulled from the images the previous job published. CI runs the newest
  # CPython only; the full five-version matrix is a release-time/local run.
  wheels:
    needs: python-packs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PYTHON_VERSION: "3.13.15"
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # binfmt qemu so the aarch64 manylinux container runs on this host.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build crossforge
        run: cargo build --release

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch this commit's el8 toolchains from GHCR
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${{ github.repository }}/toolchain"
          mkdir -p work/toolchains
          for target in x86_64 aarch64; do
            ID="gcc14.2.1-el8-$target"
            docker pull -q "$IMAGE:el8-$target-gcc14.2.1-$SHA"
            cid=$(docker create "$IMAGE:el8-$target-gcc14.2.1-$SHA")
            docker cp "$cid:/opt/crossforge/$ID" "work/toolchains/$ID"
            docker rm "$cid" >/dev/null
          done

      - name: Build el8 build environment image
        run: docker build -t crossforge-buildenv:el8 -f docker/buildenv.Dockerfile docker

      # Exercises the published-pack path: no local CPython build.
      - name: Pull python packs (${{ env.PYTHON_VERSION }}) from this commit's images
        run: |
          ./target/release/crossforge python --pull \
            --registry "ghcr.io/${{ github.repository }}/python" \
            --image-ref "${GITHUB_SHA::7}" \
            --versions "$PYTHON_VERSION" \
            --image crossforge-buildenv:el8 --work-dir "$PWD/work"

      - name: Build Rust build environment image
        run: |
          docker build -t crossforge-buildenv:el8-rust \
            -f docker/buildenv-rust.Dockerfile docker

      - name: Build, audit and verify the sample wheels
        run: |
          for sample in wheel-setuptools wheel-nanobind wheel-vendored wheel-abi3; do
            ./target/release/crossforge wheel "examples/$sample" \
              --versions "$PYTHON_VERSION" \
              --image crossforge-buildenv:el8 --work-dir "$PWD/work" \
              --out "$PWD/wheels" --verify-manylinux
          done
          # PyO3/maturin needs the Rust image.
          ./target/release/crossforge wheel examples/wheel-pyo3 \
            --versions "$PYTHON_VERSION" \
            --image crossforge-buildenv:el8-rust --work-dir "$PWD/work" \
            --out "$PWD/wheels" --verify-manylinux
          ls -la wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: sample-wheels
          path: wheels/*.whl

  # Final native-hardware check (design doc §9, T8): import every aarch64
  # wheel inside the official manylinux container on a real arm64 runner.
  wheels-arm-check:
    needs: wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sample-wheels
          path: wheels

      - name: Import every aarch64 wheel natively
        run: |
          for whl in wheels/*aarch64*.whl; do
            name=$(basename "$whl")
            module=${name%%-*}
            echo "== $name (import $module)"
            docker run --rm -v "$PWD/wheels:/wheels" \
              quay.io/pypa/manylinux_2_28_aarch64 sh -c "
                /opt/python/cp313-cp313/bin/pip install -q --target /tmp/site /wheels/$name &&
                PYTHONPATH=/tmp/site /opt/python/cp313-cp313/bin/python -c \
                  'import $module; print(\"native-arm-ok\")'"
          done
