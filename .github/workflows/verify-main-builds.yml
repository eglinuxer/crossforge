name: verify selected main stages with prepared Python components

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      selection:
        type: string
        default: ''
      python-parts:
        description: Raw Python parts from the selected canonical Bake graph
        type: string
        required: true
      python-parallelism:
        description: Maximum concurrent raw component rows and qualified rows; two or three
        type: number
        default: 2

# The caller grants the maximum needed by the producer chain. Every job
# explicitly reduces permissions; ordinary consumers cannot write or sign.
# Toolchain, GCC and vcpkg jobs have no authenticated qualification catalog.
# Selected gates therefore replay from verified raw components and require
# fresh execution evidence; a normal BuildKit cache hit cannot satisfy them.
permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      python-parts: ${{ steps.plan.outputs.python-parts }}
      python-components: ${{ steps.plan.outputs.python-components }}
      python-components-matrix: ${{ steps.plan.outputs.python-components-matrix }}
      inputs: ${{ steps.plan.outputs.inputs }}
      inputs-matrix: ${{ steps.plan.outputs.inputs-matrix }}
      toolchains: ${{ steps.plan.outputs.toolchains }}
      toolchains-matrix: ${{ steps.plan.outputs.toolchains-matrix }}
      python: ${{ steps.plan.outputs.python }}
      python-matrix: ${{ steps.plan.outputs.python-matrix }}
      python-rows-matrix: ${{ steps.plan.outputs.python-rows-matrix }}
      vcpkg: ${{ steps.plan.outputs.vcpkg }}
      vcpkg-matrix: ${{ steps.plan.outputs.vcpkg-matrix }}
      gcc: ${{ steps.plan.outputs.gcc }}
      gcc-matrix: ${{ steps.plan.outputs.gcc-matrix }}
      sdk: ${{ steps.plan.outputs.sdk }}
      sdk-matrix: ${{ steps.plan.outputs.sdk-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record controlled Python parallelism
        env:
          PYTHON_PARALLELISM: ${{ inputs.python-parallelism }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = os.environ["PYTHON_PARALLELISM"]
          if value not in ("2", "3"):
              raise SystemExit("Python parallelism must be exactly 2 or 3")
          result = {"schema_version": 1, "kind": "crossforge-python-scheduling-observation",
                    "python_parallelism": int(value), "source_commit": os.environ["GITHUB_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "performance_result": "not asserted"}
          path = Path(os.environ["RUNNER_TEMP"]) / "python-parallelism.json"
          with path.open("x", encoding="utf-8") as stream:
              json.dump(result, stream, sort_keys=True, indent=2)
              stream.write("\n")
          PY
      - name: Preserve Python scheduling observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-scheduling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-parallelism.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate selected work
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          SELECTION: ${{ inputs.selection }}
          PYTHON_PARTS: ${{ inputs.python-parts }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci-python.py execution \
            --profile "$PROFILE" --selection "$SELECTION" --parts "$PYTHON_PARTS" >> "$GITHUB_OUTPUT"

  inputs:
    permissions:
      contents: read
    needs: [plan]
    if: >-
      always() && !cancelled() && needs.plan.outputs.inputs == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
      - uses: ./.github/actions/run-build-stage
        with:
          stage: inputs
          targets-json: ${{ toJSON(fromJSON(needs.plan.outputs.selection).targets['inputs']) }}

  toolchains:
    permissions:
      contents: read
      packages: read
    needs: [plan, inputs]
    if: >-
      always() && !cancelled() && needs.plan.outputs.toolchains == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.toolchains-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/run-build-stage
        with:
          component-reader: true
          replay-qualification: true
          component-builder: ${{ steps.buildx.outputs.builder }}
          stage: ${{ matrix.stage }}
          targets-json: ${{ toJSON(fromJSON(needs.plan.outputs.selection).targets[matrix.stage]) }}

  python-components:
    needs: [plan, inputs, toolchains]
    if: >-
      always() && !cancelled() && needs.plan.outputs.python-components == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.python-parallelism }}
      matrix: ${{ fromJSON(needs.plan.outputs.python-components-matrix) }}
    uses: ./.github/workflows/produce-python.yml
    with:
      row: ${{ matrix.row }}
      parts: ${{ toJSON(matrix.parts) }}

  python:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    needs: [plan, inputs, toolchains, python-components]
    if: >-
      always() && !cancelled() && needs.plan.outputs.python == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.python-parallelism }}
      matrix: ${{ fromJSON(needs.plan.outputs.python-rows-matrix) }}
    uses: ./.github/workflows/produce-python-row.yml
    with:
      row: ${{ matrix.row }}

  vcpkg:
    permissions:
      contents: read
      packages: read
    needs: [plan, inputs, toolchains]
    if: >-
      always() && !cancelled() && needs.plan.outputs.vcpkg == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/run-build-stage
        with:
          component-reader: true
          replay-qualification: true
          component-builder: ${{ steps.buildx.outputs.builder }}
          stage: vcpkg
          targets-json: ${{ toJSON(fromJSON(needs.plan.outputs.selection).targets['vcpkg']) }}

  gcc:
    permissions:
      contents: read
      packages: read
    needs: [plan, inputs, toolchains]
    if: >-
      always() && !cancelled() && needs.plan.outputs.gcc == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.gcc-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/run-build-stage
        with:
          component-reader: true
          replay-qualification: true
          component-builder: ${{ steps.buildx.outputs.builder }}
          stage: ${{ matrix.stage }}
          targets-json: ${{ toJSON(fromJSON(needs.plan.outputs.selection).targets[matrix.stage]) }}

  sdk:
    permissions:
      contents: read
      packages: read
    needs: [plan, inputs, toolchains, python-components, python, vcpkg]
    if: >-
      always() && !cancelled() && needs.plan.outputs.sdk == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-locked-buildx
        id: buildx
      - uses: ./.github/actions/run-component-sdk
        with:
          component-builder: ${{ steps.buildx.outputs.builder }}
          targets-json: ${{ toJSON(fromJSON(needs.plan.outputs.selection).targets['sdk']) }}

  verified:
    permissions:
      contents: read
    if: always()
    needs: [plan, inputs, toolchains, python-components, python, vcpkg, gcc, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject incomplete or unplanned results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci-python.py check "$RESULTS"
