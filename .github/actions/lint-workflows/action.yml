name: Validate GitHub workflow syntax
description: Check expressions, reusable workflow contracts and action inputs with pinned actionlint
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -Eeuo pipefail
        root=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXXXX")
        trap 'rm -rf "$root"' EXIT
        curl --fail --location --retry 5 --retry-all-errors \
          --retry-delay 2 --connect-timeout 30 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$root/actionlint.tar.gz"
        printf '%s  %s\n' \
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
          "$root/actionlint.tar.gz" | sha256sum -c -
        tar -xzf "$root/actionlint.tar.gz" -C "$root" actionlint
        # Keep workflow validation independent of the runner's ShellCheck
        # version. Bash syntax is checked separately for every repository script.
        # GitHub supports concurrency.queue; pinned actionlint 1.7.12 does
        # not yet parse it. The configuration regression requires exactly
        # queue:max with cancel-in-progress:false on the qualification lock.
        "$root/actionlint" -shellcheck='' \
          -ignore 'unexpected key "queue" for "concurrency" section'
