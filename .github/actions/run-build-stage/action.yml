name: Run a hosted build stage
description: Cache-only Bake execution with resource measurements and failure diagnostics
inputs:
  stage:
    required: true
    description: Stage from scripts/ci-build.py
  write-cache:
    default: 'false'
    description: Only trusted main qualification may export registry caches
  cold:
    default: 'false'
    description: Ignore remote caches on this fresh runner
  targets-json:
    default: ''
    description: Optional selected roots, validated against this stage's canonical Bake graph
  component-reader:
    default: 'false'
    description: Use authenticated toolchain components in trusted main incremental CI
  component-builder:
    default: ''
    description: Pinned builder name required when component-reader is true
  python-components:
    default: 'false'
    description: Require prepared raw Python components as well as toolchain components
  replay-qualification:
    default: 'false'
    description: Force the selected supported qualification gates and require fresh RUN evidence
  component-recovery:
    default: ''
    description: Optional prior component-recovery.json to use without rediscovering mutable indices
  component-recovery-sha256:
    default: ''
    description: Independent canonical SHA256 required with component-recovery
runs:
  using: composite
  steps:
    - name: Validate component execution mode
      if: inputs.component-reader == 'true'
      shell: bash
      env:
        COMPONENT_BUILDER: ${{ inputs.component-builder }}
        WRITE_CACHE: ${{ inputs.write-cache }}
        COLD_BUILD: ${{ inputs.cold }}
      run: |
        set -Eeuo pipefail
        test -n "$COMPONENT_BUILDER"
        test "$WRITE_CACHE" = false
        test "$COLD_BUILD" = false
    - uses: ./.github/actions/setup-component-reader
      if: inputs.component-reader == 'true'
      id: components
      with:
        registry-token: ${{ github.token }}
    - name: Build and measure
      shell: bash
      env:
        BUILD_STAGE: ${{ inputs.stage }}
        WRITE_CACHE: ${{ inputs.write-cache }}
        COLD_BUILD: ${{ inputs.cold }}
        SELECTED_TARGETS: ${{ inputs.targets-json }}
        COMPONENT_READER: ${{ inputs.component-reader }}
        PYTHON_COMPONENTS: ${{ inputs.python-components }}
        REPLAY_QUALIFICATION: ${{ inputs.replay-qualification }}
        COMPONENT_BUILDER: ${{ inputs.component-builder }}
        COMPONENT_ORAS: ${{ steps.components.outputs.oras }}
        COMPONENT_COSIGN: ${{ steps.components.outputs.cosign }}
        COMPONENT_RECOVERY: ${{ inputs.component-recovery }}
        COMPONENT_RECOVERY_SHA256: ${{ inputs.component-recovery-sha256 }}
      run: |
        set -Eeuo pipefail
        options=()
        if test "$WRITE_CACHE" = true; then options+=(--write-cache); fi
        if test "$COLD_BUILD" = true; then options+=(--cold); fi
        selection=()
        if test -n "$SELECTED_TARGETS"; then selection+=(--targets-json "$SELECTED_TARGETS"); fi
        components=()
        if test "$REPLAY_QUALIFICATION" = true; then
          test "$COMPONENT_READER" = true
          components+=(--replay-qualification)
        fi
        if test "$PYTHON_COMPONENTS" = true; then
          test "$COMPONENT_READER" = true
          components+=(--python-components)
        fi
        if test "$COMPONENT_READER" = true; then
          components+=(--require-components --record-component-recovery --component-builder "$COMPONENT_BUILDER" --component-oras "$COMPONENT_ORAS"
            --component-cosign "$COMPONENT_COSIGN" --component-directory "$RUNNER_TEMP/component-data/$BUILD_STAGE")
        fi
        if test -n "$COMPONENT_RECOVERY" || test -n "$COMPONENT_RECOVERY_SHA256"; then
          test "$COMPONENT_READER" = true
          test -n "$COMPONENT_RECOVERY"
          test -n "$COMPONENT_RECOVERY_SHA256"
          components+=(--component-recovery "$COMPONENT_RECOVERY" --component-recovery-sha256 "$COMPONENT_RECOVERY_SHA256")
        fi
        python3 scripts/ci-build.py "${options[@]}" run "$BUILD_STAGE" \
          --directory "$RUNNER_TEMP/build-diagnostics/$BUILD_STAGE" "${selection[@]}" "${components[@]}"
    - name: Verify anonymous cache access
      if: success() && inputs.write-cache == 'true'
      shell: bash
      env:
        BUILD_STAGE: ${{ inputs.stage }}
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/build-diagnostics/$BUILD_STAGE"
        python3 scripts/check-ci-cache.py \
          --cache-config "$root/cache.json" --output "$root/cache-access.json"
    - name: Export BuildKit diagnostics
      if: always()
      shell: bash
      env:
        BUILD_STAGE: ${{ inputs.stage }}
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/build-diagnostics/$BUILD_STAGE"
        ./scripts/collect-buildkit-diagnostics.sh "$root"
    - name: Preserve build diagnostics
      if: always()
      id: diagnostics
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: build-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-diagnostics/${{ inputs.stage }}/
        retention-days: 7
        if-no-files-found: warn
    - name: Report immutable recovery selection
      if: always() && inputs.component-reader == 'true'
      shell: bash
      env:
        BUILD_STAGE: ${{ inputs.stage }}
        RECOVERY_ARTIFACT_ID: ${{ steps.diagnostics.outputs.artifact-id }}
      run: |
        set -Eeuo pipefail
        python3 - "$RUNNER_TEMP/build-diagnostics/$BUILD_STAGE/result.json" <<'PY'
        import json, os, pathlib, sys
        path = pathlib.Path(sys.argv[1])
        value = json.loads(path.read_text()) if path.is_file() else {}
        digest = value.get('component_recovery_sha256')
        if digest and os.environ.get('RECOVERY_ARTIFACT_ID'):
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                stream.write('\nComponent recovery: run `%s`, artifact `%s`, canonical SHA256 `%s`.\n' % (
                    os.environ['GITHUB_RUN_ID'], os.environ['RECOVERY_ARTIFACT_ID'], digest))
        PY
    - name: Log out the component reader
      if: always() && inputs.component-reader == 'true'
      shell: bash
      run: docker logout ghcr.io
