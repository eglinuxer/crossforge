name: Integrate SDK from prepared components
description: Reuse matching row qualifications or run them on this SDK worker before final integration
inputs:
  component-builder:
    required: true
    description: Pinned builder shared by row qualification and SDK integration
  targets-json:
    required: true
    description: Selected canonical SDK roots
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-component-reader
      id: components
      with:
        registry-token: ${{ github.token }}
    - name: Verify rows and freshly integrate the selected SDK
      shell: bash
      env:
        COMPONENT_BUILDER: ${{ inputs.component-builder }}
        SELECTED_TARGETS: ${{ inputs.targets-json }}
        COMPONENT_ORAS: ${{ steps.components.outputs.oras }}
        COMPONENT_COSIGN: ${{ steps.components.outputs.cosign }}
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/build-diagnostics/sdk"
        mkdir -p "$root"
        python3 scripts/run-with-heartbeat.py --label sdk-components --log "$root/build.log" -- \
          python3 scripts/ci-sdk.py --targets-json "$SELECTED_TARGETS" \
            --builder "$COMPONENT_BUILDER" --oras "$COMPONENT_ORAS" --cosign "$COMPONENT_COSIGN" \
            --component-directory "$RUNNER_TEMP/component-data/sdk" --output "$root/execution"
    - name: Export BuildKit diagnostics
      if: always()
      shell: bash
      run: ./scripts/collect-buildkit-diagnostics.sh "$RUNNER_TEMP/build-diagnostics/sdk"
    - name: Preserve SDK and row diagnostics
      if: always()
      id: diagnostics
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: build-sdk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-diagnostics/sdk/
        retention-days: 7
        if-no-files-found: warn
    - name: Report the immutable SDK recovery selections
      if: always()
      shell: bash
      env:
        RECOVERY_ARTIFACT_ID: ${{ steps.diagnostics.outputs.artifact-id }}
      run: |
        python3 - "$RUNNER_TEMP/build-diagnostics/sdk/execution" <<'PY'
        import json, os, pathlib, sys
        root = pathlib.Path(sys.argv[1])
        for name, label, document in (
                ('recovery-reference.json', 'raw component', 'component-recovery.json'),
                ('sdk-recovery-reference.json', 'complete component (32 raw + 6 signed rows)', 'acquisition/component-recovery.json')):
            path = root / name
            value = json.loads(path.read_text()) if path.is_file() else {}
            if value and os.environ.get('RECOVERY_ARTIFACT_ID'):
                with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                    stream.write('\nSDK %s recovery: run `%s`, artifact `%s`, canonical SHA256 `%s`; '
                        'document `execution/%s`.\n' % (label, os.environ['GITHUB_RUN_ID'],
                        os.environ['RECOVERY_ARTIFACT_ID'], value['sha256'], document))
        PY
    - name: Log out the component reader
      if: always()
      shell: bash
      run: docker logout ghcr.io
